# eez-proverd on a REMOTE machine (the composer runs elsewhere with
# docker-compose.remote-prover.override.yml). Mirrors the eez-proverd
# service of docker-compose.driven.override.yml minus the colocation
# assumptions: no depends_on, endpoints pointed at the composer host, and
# NO .env.chiado env_file — the prover needs ONLY EEZ_PROOF_SIGNER_KEY;
# the L1 poster key must not leave the composer machine.
#
# The prover is a pure dial-out client (it listens on nothing) and
# reconnects forever with capped exponential backoff, so composer
# restarts and WAN blips are survivable.
#
# Fill in (env or a small .env file):
#   EEZ_COMPOSER_HOST=<composer's VPN/LAN IP>     # e.g. its WireGuard IP
#   EEZ_PROOF_SIGNER_KEY=<the shared registered signer key>
#
# Run (on the prover machine, from a checkout of this repo):
#   docker compose -f docker-compose.proverd.remote.yml build eez-proverd
#   docker compose -f docker-compose.proverd.remote.yml up -d
services:
  eez-proverd:
    build:
      context: .
      dockerfile: Dockerfile.proverd
    # Or run a CI-published image: EEZ_PROVERD_IMAGE=ghcr.io/eez-association/
    # eez-proverd:<tag> + EEZ_PULL_POLICY=always (see .env.ghcr.example).
    image: ${EEZ_PROVERD_IMAGE:-eez-proverd:local}
    pull_policy: ${EEZ_PULL_POLICY:-missing}
    container_name: eez-proverd
    # Host networking so the container can dial the composer over a host
    # VPN interface (WireGuard) without NAT/DNS indirection.
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      RUST_LOG: "info,eez_proverd=info"
      # Take the verify range from the composer's ProverDispatch stream.
      EEZ_COMPOSER_DRIVEN: "1"
      # The composer's control feed: ControlFeed + ProverDispatch + ProofSink.
      # Must be plain http:// — the gRPC channel has no TLS support as built.
      EEZ_CONTROL_RPC_URL: "http://${EEZ_COMPOSER_HOST:?set EEZ_COMPOSER_HOST to the composer's VPN/LAN IP}:${EEZ_CONTROL_RPC_PORT:-50051}"
      # The composer's L2 archive RPC (debug_*) for durable backfill of
      # replay-gap blocks. Backfill pays 2 RPC round trips per block, so
      # keep the parallelism up over a WAN link.
      EEZ_L2_RPC_URL: "http://${EEZ_COMPOSER_HOST}:18688"
      EEZ_BACKFILL_CONCURRENCY: "${EEZ_BACKFILL_CONCURRENCY:-8}"
      # The one secret the prover needs: the registered proof signer
      # (== the proof system's authorizedSigner == the node's attester).
      EEZ_PROOF_SIGNER_KEY: "${EEZ_PROOF_SIGNER_KEY:?set EEZ_PROOF_SIGNER_KEY (the shared registered signer key)}"
      # native-validate (stateless re-execution) + L2 chain-config, both
      # baked into the image by Dockerfile.proverd.
      EEZ_VALIDATOR_BIN: "/usr/local/bin/native-validate"
      EEZ_CHAIN_CONFIG: "/app/l2-chainconfig.json"
    # Override the image's `--help` default CMD (`command: []` is silently
    # ignored by compose, so pass the real run explicitly).
    command:
      - "--control-addr"
      - "http://${EEZ_COMPOSER_HOST}:${EEZ_CONTROL_RPC_PORT:-50051}"
      - "--validator-bin"
      - "/usr/local/bin/native-validate"
      - "--chain-config"
      - "/app/l2-chainconfig.json"
    logging:
      driver: "local"
