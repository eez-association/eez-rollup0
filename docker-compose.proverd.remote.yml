# eez-proverd on a REMOTE machine, REVERSE transport: this daemon LISTENS
# (EEZ_CONTROL_LISTEN_ADDR) and the composer dials in from its outbound-only
# host (EEZ_CONTROL_DIAL_ADDR on the node, see
# docker-compose.remote-prover.override.yml). No .env.chiado here — the
# prover needs ONLY EEZ_PROOF_SIGNER_KEY; the L1 poster key must not leave
# the composer machine. See docs/reverse-control-transport-design.md.
#
# SECURITY — the listener is the transport's front door. Without the
# source-IP allowlist anyone could stream this daemon windows to attest (a
# signing oracle for the registered key). EEZ_ALLOWED_COMPOSER_IPS is
# REQUIRED (the daemon refuses to start without it) and must be the
# composer's PUBLIC IP as seen from here. It is only meaningful for a
# stable, non-shared source IP — front a CGNAT/shared-IP composer with a
# per-peer tunnel instead.
#
# VALIDATOR REQUIRED — reverse mode assumes a validating prover (an
# untrusted composer must never be attested without stateless re-execution).
# The daemon bails unless EEZ_VALIDATOR_BIN + EEZ_CHAIN_CONFIG are set.
#
# BACKFILL DISABLED — EEZ_L2_RPC_URL is EXPLICITLY empty (the composer's L2
# archive is unreachable here). The composer's replay ring covers ordinary
# reconnects; an outage beyond the ring's horizon fails loud until history
# is re-served (accepted Level-1 limitation).
#
# Fill in (env or a small .env file):
#   EEZ_ALLOWED_COMPOSER_IPS=<composer's public IP>
#   EEZ_PROOF_SIGNER_KEY=<the registered signer key — must derive the PS's
#                         authorizedSigner address>
#
# Run (from a checkout of this repo on the prover machine):
#   docker compose -f docker-compose.proverd.remote.yml build eez-proverd
#   docker compose -f docker-compose.proverd.remote.yml up -d
services:
  eez-proverd:
    build:
      context: .
      dockerfile: Dockerfile.proverd
    image: ${EEZ_PROVERD_IMAGE:-eez-proverd:local}
    pull_policy: ${EEZ_PULL_POLICY:-missing}
    container_name: eez-proverd
    # Host networking: the listener binds the host interface directly (the
    # machine is expected to be reachable on EEZ_CONTROL_LISTEN_PORT, e.g.
    # via DMZ or a router forward).
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      RUST_LOG: "info,eez_proverd=info"
      # Take the verify range from the composer's ProverDispatch stream.
      EEZ_COMPOSER_DRIVEN: "1"
      # REVERSE transport: listen here; the composer dials in.
      EEZ_CONTROL_LISTEN_ADDR: "0.0.0.0:${EEZ_CONTROL_LISTEN_PORT:-50051}"
      # REQUIRED source-IP allowlist (comma-separated) — the composer's
      # public IP(s) as seen from this machine.
      EEZ_ALLOWED_COMPOSER_IPS: "${EEZ_ALLOWED_COMPOSER_IPS:?set EEZ_ALLOWED_COMPOSER_IPS to the composer's public IP}"
      # Backfill disabled (see header) — explicit empty, not omitted.
      EEZ_L2_RPC_URL: ""
      # The one secret the prover needs: the registered proof signer
      # (== the proof system's authorizedSigner == the node's attester).
      EEZ_PROOF_SIGNER_KEY: "${EEZ_PROOF_SIGNER_KEY:?set EEZ_PROOF_SIGNER_KEY (the registered signer key)}"
      # native-validate (stateless re-execution) + L2 chain-config, both
      # baked into the image by Dockerfile.proverd. MANDATORY in reverse mode.
      EEZ_VALIDATOR_BIN: "/usr/local/bin/native-validate"
      EEZ_CHAIN_CONFIG: "/app/l2-chainconfig.json"
    # Override the image's `--help` default CMD (`command: []` is silently
    # ignored by compose, so pass the real run explicitly). The control
    # endpoint comes from EEZ_CONTROL_LISTEN_ADDR above (no --control-addr).
    command:
      - "--validator-bin"
      - "/usr/local/bin/native-validate"
      - "--chain-config"
      - "/app/l2-chainconfig.json"
    logging:
      driver: "local"
