[package]
name                   = "eez-node"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
description            = "eez Rollup-0 node — vanilla reth driven by an eez sequencer."

[dependencies]
eez-protocol.workspace      = true
# RemoteProver + the prove.v1 wire types (the in-process mock prover
# implements the same service).
eez-proverd.workspace       = true

# reth
reth-chainspec.workspace                  = true
reth-cli.workspace                        = true
reth-db.workspace                         = true
reth-engine-primitives.workspace          = true
reth-ethereum-cli.workspace               = true
reth-ethereum-engine-primitives.workspace = true
reth-ethereum-payload-builder.workspace   = true
reth-ethereum-primitives.workspace        = true
reth-evm.workspace                        = true
reth-evm-ethereum.workspace               = true
reth-network-peers.workspace              = true
reth-node-api.workspace                   = true
reth-node-builder.workspace               = true
reth-node-core.workspace                  = true
reth-node-ethereum.workspace              = true
reth-payload-builder.workspace            = true
reth-payload-primitives.workspace         = true
reth-primitives-traits.workspace          = true
reth-provider.workspace                   = true
# `witness` feature gates ExecutionWitnessRecord::into_execution_witness,
# used by the per-block witness re-exec (driver::witness).
reth-revm                                 = { workspace = true, features = ["witness"] }
reth-rpc-eth-api.workspace                = true
reth-storage-api.workspace                = true
reth-tasks.workspace                      = true
reth-transaction-pool.workspace           = true
reth-trie.workspace                       = true
reth-trie-common.workspace                = true
# Persistent witness store: dedicated mdbx env, separate from reth's node DB.
reth-libmdbx.workspace                    = true

# revm direct (inspector + overlay-channel paths in composer::local::session)
revm.workspace = true

# Gnosis (chiado) L1 — provided when EEZ_L1_EMBEDDED=1 and the smoke
# targets chiado; the L1 NodeBuilder uses these.
reth_gnosis.workspace                     = true
gnosis-primitives.workspace               = true

# alloy
alloy-consensus.workspace        = true
alloy-contract.workspace         = true
alloy-eips.workspace             = true
alloy-network.workspace          = true
alloy-primitives.workspace       = true
alloy-rlp.workspace              = true
alloy-rpc-types-debug.workspace  = true
alloy-rpc-types-engine.workspace = true
alloy-rpc-types-eth.workspace    = true
alloy-sol-types.workspace        = true
alloy-provider.workspace         = true
alloy-signer.workspace           = true
alloy-signer-local.workspace     = true
reqwest.workspace                = true

# Cross-chain RPC fronts (transparent hyper proxy: forward every eth_* to the
# source chain's node so cast/wallets read chainId/nonce/gas/receipt, intercept
# eth_sendRawTransaction → HeldPool).
hyper          = { version = "1.9", features = ["server", "http1"] }
hyper-util     = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
# Embedded dev-L1 in-process eth_sendBundle module (bundle_rpc, #30).
jsonrpsee.workspace  = true
serde.workspace      = true
serde_json.workspace = true
# Witness-store value codec (compact binary).
postcard.workspace   = true
# In-process mock prover: a `prove.v1.Prover` stub served on localhost in
# mock mode so the composer always talks to the prover over gRPC.
tonic.workspace        = true
tokio-stream           = { workspace = true, features = ["net"] }

# app
async-trait.workspace        = true
clap.workspace               = true
dotenvy.workspace            = true
eyre.workspace               = true
fail.workspace               = true
mimalloc.workspace           = true
thiserror.workspace          = true
tokio.workspace              = true
tracing.workspace            = true
tracing-subscriber.workspace = true
url.workspace                = true

[dev-dependencies]
alloy-genesis = { version = "2", default-features = false }
alloy-transport = { version = "2", default-features = false }
anyhow = "1"
tempfile = "3"

[features]
# TEST-ONLY (deriver-gate attack test): inject a corrupted OUTBOUND settlement
# entry into postBatch so a live node exercises verify_outbound_authorized's
# reject path. NEVER enabled in normal/release builds. Revert: `git restore`.
fault-inject = []

[lints]
workspace = true
