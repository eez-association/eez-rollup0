[package]
name                   = "eez-node"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
description            = "eez Rollup-0 node — vanilla reth driven by an eez sequencer."

[dependencies]
eez-composer.workspace      = true
eez-deriver.workspace       = true
eez-driver.workspace        = true
eez-evm.workspace           = true
eez-evm-inspector.workspace = true
eez-l1.workspace            = true
eez-protocol.workspace      = true
eez-prover.workspace        = true

# reth
reth-chainspec.workspace                  = true
reth-cli.workspace                        = true
reth-db.workspace                         = true
reth-ethereum-cli.workspace               = true
reth-ethereum-engine-primitives.workspace = true
reth-ethereum-payload-builder.workspace   = true
reth-ethereum-primitives.workspace        = true
reth-evm.workspace                        = true
reth-evm-ethereum.workspace               = true
reth-network-peers.workspace              = true
reth-node-api.workspace                   = true
reth-node-builder.workspace               = true
reth-node-core.workspace                  = true
reth-node-ethereum.workspace              = true
reth-primitives-traits.workspace          = true
reth-storage-api.workspace                = true
reth-tasks.workspace                      = true
reth-transaction-pool.workspace           = true

# Gnosis (chiado) L1 — provided when EEZ_L1_EMBEDDED=1 and the smoke
# targets chiado; the L1 NodeBuilder uses these.
reth_gnosis.workspace                     = true
gnosis-primitives.workspace               = true

# alloy
alloy-consensus.workspace    = true
alloy-eips.workspace         = true
alloy-primitives.workspace   = true
alloy-provider.workspace     = true
alloy-signer-local.workspace = true
reqwest.workspace            = true

# Cross-chain RPC fronts (transparent hyper proxy: forward every eth_* to the
# source chain's node so cast/wallets read chainId/nonce/gas/receipt, intercept
# eth_sendRawTransaction → HeldPool).
hyper          = { version = "1.9", features = ["server", "http1"] }
hyper-util     = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
serde_json.workspace = true

# app
clap.workspace               = true
dotenvy.workspace            = true
eyre.workspace               = true
mimalloc.workspace           = true
thiserror.workspace          = true
tokio.workspace              = true
tracing.workspace            = true
tracing-subscriber.workspace = true
url.workspace                = true

[dev-dependencies]
alloy-consensus.workspace = true
alloy-contract.workspace = true
alloy-genesis = { version = "2", default-features = false }
alloy-network.workspace = true
alloy-provider = { workspace = true, features = ["reqwest"] }
alloy-rpc-types-eth.workspace = true
alloy-signer-local.workspace = true
alloy-sol-types.workspace = true
anyhow = "1"
reth-chainspec.workspace = true
serde_json = "1"
tempfile = "3"

[features]
# TEST-ONLY passthrough to eez-composer/fault-inject (deriver-gate attack test).
# NEVER enabled in normal/release builds. Revert: `git restore`.
fault-inject = ["eez-composer/fault-inject"]

[lints]
workspace = true
