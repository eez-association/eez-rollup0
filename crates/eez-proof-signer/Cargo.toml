[package]
name                   = "eez-proof-signer"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
description            = "Shared EEZ proof-signer gRPC, settlement-validation, and attestation pipeline."

[features]
test-utils = []

[dependencies]
# The `prove.v1` wire this daemon serves.
eez-control-rpc.workspace = true
# Canonical `postAndVerifyBatch` ABI types and codec.
eez-protocol.workspace = true

alloy-consensus.workspace = true
alloy-primitives = { workspace = true, features = ["k256"] }
alloy-rlp.workspace = true
alloy-rpc-types-debug.workspace = true
# The canonical signer type `SystemTxContext` stores; parsing the L2 system
# key directly into it avoids a second secret representation.
alloy-signer-local.workspace = true
alloy-sol-types.workspace = true

reth-chainspec.workspace = true
reth-ethereum-primitives.workspace = true
reth-primitives-traits.workspace = true

eyre.workspace = true
prost.workspace = true
thiserror.workspace = true
tokio.workspace = true
tonic.workspace = true
tracing.workspace = true

[dev-dependencies]
# Recorded calldata fixture decoding.
hex.workspace = true
serde_json.workspace = true
# Client-side of the in-process Prove round-trip tests.
tokio-stream = { workspace = true, features = ["net"] }

[lints]
workspace = true
