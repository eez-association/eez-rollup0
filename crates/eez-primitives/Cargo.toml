[package]
name = "eez-primitives"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[features]
default = ["serde"]
serde = []
# revm `TxEnv` conversions for the revm-based proof signer (`prover/`).
revm = ["dep:revm", "dep:alloy-evm"]

[dependencies]
alloy-consensus = { workspace = true, features = ["serde", "k256"] }
alloy-eips.workspace = true
alloy-primitives = { workspace = true, features = ["serde"] }
alloy-rlp.workspace = true
reth-codecs.workspace = true
reth-primitives-traits = { workspace = true, features = ["serde", "reth-codec"] }
serde.workspace = true

# Shared with the `prover/` workspace: no git-pinned reth or EVM crates here.
# Explicit versions, not `workspace = true`, so they outlive the node's own revm.
revm = { version = "43", optional = true, default-features = false, features = [
    "optional_balance_check",
    "optional_block_gas_limit",
    "optional_eip3607",
    "optional_no_base_fee",
] }
alloy-evm = { version = "=0.39.0", optional = true }

reth-rpc-traits.workspace = true
alloy-rpc-types-eth.workspace = true
alloy-network.workspace = true
alloy-serde.workspace = true

[dev-dependencies]
serde_json.workspace = true

[lints]
workspace = true
