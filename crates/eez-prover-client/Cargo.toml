[package]
name                   = "eez-prover-client"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
description            = "RemoteProver: the composer-side Prover implementation for one eez-proof-signer RPC round-trip."

[dependencies]
eez-prover.workspace      = true
eez-control-rpc.workspace = true
# Encode ProvingContext.batch → postAndVerifyBatch calldata for the wire.
eez-protocol.workspace    = true

alloy-primitives.workspace = true
alloy-sol-types.workspace  = true

async-trait.workspace = true
tokio-stream.workspace = true
tracing.workspace      = true

[dev-dependencies]
# In-process stub `Prove` server (tonic) + a signing key to exercise RemoteProver.
tokio                        = { workspace = true }
tonic.workspace              = true
tokio-stream                 = { workspace = true, features = ["net"] }
alloy-signer.workspace       = true
alloy-signer-local.workspace = true

[lints]
workspace = true
