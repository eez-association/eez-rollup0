[package]
name = "crosschain-evm-composer"
version = "0.1.0"
edition = "2024"
license.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "EVM composer glue: revm Inspector for proxy-call detection + EVM-bound type aliases for the chain-agnostic Composer"

[lints]
workspace = true

[dependencies]
# Protocol + EVM
crosschain-protocol.workspace = true
crosschain-evm.workspace = true

# Alloy types (Bytes, Address) for inspector calldata/addr handling +
# RPC types / sol! / provider stack for Phase 09 §E1 post-batch
# submission. The provider stack is wallet-filled by the caller; this
# crate only depends on the trait surface, not on a concrete transport.
alloy-primitives.workspace = true
alloy-network.workspace = true
alloy-provider.workspace = true
alloy-rpc-types-eth.workspace = true
alloy-sol-types.workspace = true

# EVM inspector (the one genuinely EVM-coupled piece in this crate)
revm.workspace = true

# Async traits for the sync→async bridge inside Inspector::call AND
# the Phase 09 submitter's `ProofPlanResolver` consumer.
async-trait.workspace = true

# Tokio runtime handle for the sync→async bridge inside Inspector::call
tokio.workspace = true

# Logging
tracing.workspace = true

# Error types for overlay + submitter
thiserror.workspace = true
