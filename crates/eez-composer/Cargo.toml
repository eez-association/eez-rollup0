[package]
name                   = "eez-composer"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
description            = "Composer umbrella — owns per-rollup Sequencer/Scheduler/HeldPool maps and the shared Aggregator/Submitter/Prover."

[dependencies]
eez-primitives.workspace = true
eez-engine.workspace = true
eez-evm.workspace = true
# Internal — protocol, EVM port, and the existing umbrella siblings
eez-driver = { workspace = true, features = ["witness"] }
eez-blob.workspace           = true
eez-l1.workspace             = true
eez-payload-codec.workspace  = true
eez-protocol.workspace       = true
eez-prover.workspace         = true

# gnosis — chiado L1 header type for GnosisL1Adapter
gnosis-primitives.workspace = true

# alloy
alloy-consensus.workspace        = true
alloy-eips.workspace             = true
alloy-network.workspace          = true
alloy-primitives.workspace       = true
alloy-provider.workspace         = true
alloy-rpc-client.workspace       = true
alloy-rpc-types-engine.workspace = true
alloy-rpc-types-eth.workspace    = true
alloy-signer-local.workspace     = true
alloy-sol-types.workspace        = true

# reth (state + chainspec + evm for LocalChainClient + sessions,
# payload-primitives for build_sync_block → ExecutionData)
reth-chain-state.workspace                = true
reth-chainspec.workspace                  = true
reth-ethereum-primitives.workspace        = true
reth-evm.workspace                        = true
reth-payload-primitives.workspace         = true
reth-primitives-traits.workspace          = true
reth-storage-api.workspace                = true

# evm2 direct (simulation state, inspectors, overlay channel)
evm2.workspace = true

# async + diagnostics
async-trait.workspace  = true
futures-util.workspace = true
thiserror.workspace    = true
tokio.workspace        = true
tracing.workspace      = true

[dev-dependencies]
alloy-transport = { version = "2", default-features = false }
# MockEthProvider: an in-memory StateProviderFactory for the prefix-state
# equivalence test (no datadir, no engine API).
reth-provider = { workspace = true, features = ["test-utils"] }
tokio = { workspace = true, features = ["test-util"] }
proptest = "1"

[lints]
workspace = true
