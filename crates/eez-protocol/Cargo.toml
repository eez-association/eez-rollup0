[package]
name                   = "eez-protocol"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
description            = "Chain-agnostic cross-chain composition: protocol traits, generic composer, checkpoint format. Ported from crosschain-protocol (rollup-node)."

[dependencies]
async-trait.workspace = true
thiserror.workspace   = true
serde.workspace       = true
# Logging in the generic Composer. Runtime-agnostic — doesn't pull tokio.
tracing.workspace     = true
# Pure-Rust keccak-256 for the rolling-hash accumulators. Keeps
# this crate's zero-alloy/reth dependency surface intact.
sha3.workspace        = true

[dev-dependencies]
tokio        = { workspace = true, features = ["macros", "rt-multi-thread"] }
serde_json.workspace = true
hex.workspace = true

[features]
# Exposes `eez_protocol::testing::FakeChainClient` for downstream test
# code. Off by default — library consumers never need it; test
# consumers add `features = ["testing"]` to their dev-dependency on
# this crate.
testing = []

[lints]
workspace = true
