// Streaming Composer-to-prover protocol. prove.v1.Prover/Prove remains available
// during migration. A stream carries one logical Composer session; reconnecting
// uses Resume, while Rewind replaces an unsafe suffix after an L2 reorg.
syntax = "proto3";

package prove.v2;

import "prove.proto";

service Prover {
  rpc ProveStream(stream ClientFrame) returns (stream ServerFrame);
}

message ClientFrame {
  // Empty only on Begin. The server issues this opaque ID; it is never a block
  // or proof identity and is not shared between Composers.
  bytes session_id = 1;
  // Chosen by the client and echoed on every response to this operation.
  uint64 request_id = 2;
  // Zero on Begin and Resume. Ready issues a new fencing epoch; every other
  // frame must carry the latest epoch returned for this session.
  uint64 epoch = 3;
  oneof kind {
    Begin begin = 4;
    Resume resume = 5;
    Rewind rewind = 6;
    Block block = 7;
    Finalize finalize = 8;
    Cancel cancel = 9;
  }
}

message Begin {
  uint64 rollup_id = 1;
  // Last settled block. The first expected streamed block is anchor_number + 1.
  uint64 anchor_number = 2;
  bytes anchor_hash = 3;
  bytes anchor_state_root = 4;
}

message Resume {}

message Rewind {
  // Must identify the anchor or a fully validated block in this session's
  // current active prefix. The block number and state root are already known.
  bytes ancestor_hash = 1;
}

message Block {
  // One block per stream frame. A contiguous run is sent as back-to-back frames
  // on this same RPC without waiting for a Validated response between blocks.
  // Contains exact consensus bytes and, for the stateless backend, its witness.
  prove.v1.BlockWitness data = 1;
}

message Finalize {
  // First block of the selected validated range. Its predecessor becomes this
  // finalization's settlement anchor and must also belong to the session.
  uint64 from_block = 1;
  uint64 to_block = 2;
  bytes terminal_hash = 3;
  // Exact proofless postAndVerifyBatch calldata. No proof may be returned until
  // it has been checked against this session's ordered validated prefix. A
  // Proof closes this transport stream but leaves the session resumable from
  // the selected predecessor anchor.
  prove.v1.PostBatch post_batch = 4;
}

message Cancel {}

message ServerFrame {
  // A successful Begin carries the new nonempty ID; a rejected Begin carries
  // an empty ID. Every response after Ready echoes the established session ID.
  bytes session_id = 1;
  // Echoes the request_id of the ClientFrame this response addresses.
  uint64 request_id = 2;
  // The authoritative fencing epoch for this operation. Ready returns a newly
  // issued epoch after Begin, Resume, or Rewind; Cancelled echoes the epoch it
  // retired. A response not referring to an authorized session carries zero.
  uint64 epoch = 3;
  oneof kind {
    Ready ready = 4;
    Validated validated = 5;
    Proof proof = 6;
    Cancelled cancelled = 7;
    Rejected rejected = 8;
  }
}

message Ready {
  // This is the last FULLY VALIDATED block, not the last received message.
  uint64 validated_through = 1;
  bytes validated_hash = 2;
}

message Validated {
  uint64 number = 1;
  bytes hash = 2;
  bytes post_state_root = 3;
  // True only when another session's completed validation was reused.
  bool reused = 4;
}

message Proof {
  bytes public_inputs_hash = 1;
  bytes proof = 2;
}

message Cancelled {}

message Rejected {
  // The numeric tonic::Code value. A rejection applies only to the named
  // session/request; it must not terminate unrelated Composer sessions.
  int32 code = 1;
  string message = 2;
  // Encoded prove.v1.ProveFailure when an actionable candidate is known.
  bytes details = 3;
  // Authoritative fully validated cursor when this is a session-bound
  // rejection. Both fields are zero/empty when the response cannot refer to an
  // authorized session.
  uint64 validated_through = 4;
  bytes validated_hash = 5;
}
