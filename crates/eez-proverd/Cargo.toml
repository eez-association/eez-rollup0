[package]
name                   = "eez-proverd"
version.workspace      = true
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
description            = "Composer-controlled prover server: one Prove RPC — stage the window, native-validate re-execution, fail-closed settlement gates, ECDSA attestation."

[dependencies]
# Prove wire (server side).
eez-control-rpc.workspace = true
# Gates + publicInputsHash recompute + EcdsaProofSigner.
# RollupId for the inbound-outcome cross-chain hash binding.
eez-protocol.workspace    = true

alloy-primitives.workspace = true
alloy-consensus.workspace  = true
alloy-rlp.workspace        = true
# Decode the window blocks' RLP for the system-tx / inbound gates.
reth-ethereum-primitives.workspace = true
reth-primitives-traits.workspace   = true

serde_json.workspace = true
hex.workspace        = true
clap  = { workspace = true, features = ["env"] }
eyre.workspace       = true
tokio.workspace      = true
tracing.workspace    = true
tracing-subscriber           = { workspace = true, features = ["env-filter"] }
tonic = { workspace = true, features = ["server"] }

[lints]
workspace = true
