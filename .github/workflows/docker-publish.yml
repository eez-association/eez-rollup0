name: Docker Publish

# Builds the eez-node and eez-proverd images and publishes them to GHCR.
#   - push to main / tag v*  -> build + PUSH (tags: latest on main, sha-<short>, vX.Y.Z)
#   - pull_request           -> build ONLY (validates the Dockerfile, no push, no secrets)
#   - workflow_dispatch      -> manual build + push
#
# Public-repo notes: only the auto GITHUB_TOKEN is used (no custom secrets), and
# login/push are gated to non-PR events, so fork PRs run with a read-only token
# and cannot publish. The proverd build clones the public eez-association/zisk-*
# repos anonymously. Action SHAs are pinned.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  build-push:
    name: Build & push ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: eez-node
            dockerfile: Dockerfile
          - image: eez-proverd
            dockerfile: Dockerfile.proverd
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          submodules: recursive

      - name: Set up Buildx
        uses: docker/setup-buildx-action@6524bf65af31da8d45b59e8c27de4bd072b392f5 # v3.8.0

      # Skipped on pull_request: fork PRs get a read-only token and no secrets,
      # so they build-only (push=false below) and never authenticate.
      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (tags + labels)
        id: meta
        uses: docker/metadata-action@369eb591f429131d6889c46b94e711f089e6ca96 # v5.6.1
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: Build and push
        uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355 # v6.10.0
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GHA layer cache, scoped per image: caches the slow cargo-chef cook
          # layer (and, for proverd, the native-validate clone+build).
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
          # Single-arch image (no provenance/SBOM manifest) so `docker pull`
          # stays a plain image, not a multi-manifest index.
          provenance: false
