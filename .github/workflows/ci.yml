name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # @stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev pkg-config libssl-dev cmake protobuf-compiler
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # @stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: Install nextest
        uses: taiki-e/install-action@fd2f5e3d644b484055ebf4268f474c565f148f25 # v2
        with:
          tool: nextest@0.9.137
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev pkg-config libssl-dev cmake protobuf-compiler
      - name: Unit tests (lib + bins, parallel)
        run: cargo nextest run --workspace --lib --bins --no-fail-fast
      - name: Protocol integration vectors
        run: >-
          cargo nextest run -p eez-protocol
          --test public_inputs_hash_vectors
          --test rolling_hash_vectors
          --no-fail-fast

  contract-tests:
    name: Contract Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@c7450ba673e133f5ee30098b3b54f444d3a2ca2d # v1
        with:
          version: v1.7.1
      - name: Test integration contracts
        working-directory: contracts
        run: forge test
      - name: Test core protocol contracts
        working-directory: eez-core-protocol
        run: forge test --no-match-test 'test_Doc_OriginalValue_SeedInSetup|test_PostCost_Incremental'

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # @stable
      - uses: taiki-e/install-action@fd2f5e3d644b484055ebf4268f474c565f148f25 # v2
        with:
          tool: cargo-deny,cargo-audit
      - name: Check dependency policy
        run: cargo deny check advisories bans sources
      - name: Check known vulnerabilities
        run: cargo audit

  embedded-e2e:
    name: Embedded E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      EEZ_TEST_LOG_DIR: ${{ github.workspace }}/artifacts/embedded-e2e/logs
      EEZ_TEST_DATADIR_DIR: ${{ github.workspace }}/artifacts/embedded-e2e/datadirs
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # @stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@c7450ba673e133f5ee30098b3b54f444d3a2ca2d # v1
        with:
          version: v1.7.1
      - name: Install nextest
        uses: taiki-e/install-action@fd2f5e3d644b484055ebf4268f474c565f148f25 # v2
        with:
          tool: nextest@0.9.137
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq libclang-dev pkg-config libssl-dev cmake protobuf-compiler
      - name: Build contracts (artifacts read by harness)
        working-directory: contracts
        run: forge build
      - name: Build proof signer (launched by harness)
        run: cargo build -p eez-proof-signer --locked
      - name: Verify generated EEZL2 genesis artifacts
        run: scripts/update-eezl2-genesis.sh --check
      - name: Integration tests (e2e, serial)
        timeout-minutes: 40
        run: |
          mkdir -p artifacts/embedded-e2e
          set +e
          cargo nextest run -P ci -p eez-node --test e2e --test-threads=1 --no-fail-fast --color=always 2>&1 \
            | tee artifacts/embedded-e2e/nextest.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"
      - name: Upload embedded e2e diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: embedded-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/embedded-e2e
          if-no-files-found: warn
          retention-days: 7

  cross-chain-e2e:
    name: Cross-Chain E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EEZ_TEST_LOG_DIR: ${{ github.workspace }}/artifacts/cross-chain-e2e/logs
      EEZ_TEST_DATADIR_DIR: ${{ github.workspace }}/artifacts/cross-chain-e2e/datadirs
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # @stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@c7450ba673e133f5ee30098b3b54f444d3a2ca2d # v1
        with:
          version: v1.7.1
      - name: Install nextest
        uses: taiki-e/install-action@fd2f5e3d644b484055ebf4268f474c565f148f25 # v2
        with:
          tool: nextest@0.9.137
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev pkg-config libssl-dev cmake protobuf-compiler
      - name: Build contracts (artifacts read by harness)
        working-directory: contracts
        run: forge build
      - name: Build proof signer (launched by harness)
        run: cargo build -p eez-proof-signer --locked
      - name: Integration tests (cross-chain, serial)
        timeout-minutes: 75
        run: |
          mkdir -p artifacts/cross-chain-e2e
          set +e
          cargo nextest run -P ci -p eez-node \
            --test cross_chain --test chained_interstate --test-threads=1 \
            --no-fail-fast --color=always 2>&1 \
            | tee artifacts/cross-chain-e2e/nextest.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"
      - name: Upload cross-chain e2e diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cross-chain-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/cross-chain-e2e
          if-no-files-found: warn
          retention-days: 7
