name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  ci:
    name: Format, Clippy, Unit & E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # @stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@c7450ba673e133f5ee30098b3b54f444d3a2ca2d # v1
      - name: Install nextest
        uses: taiki-e/install-action@fd2f5e3d644b484055ebf4268f474c565f148f25 # v2
        with:
          tool: nextest
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev pkg-config libssl-dev cmake
      - name: Format
        run: cargo fmt --all --check
      # Build everything (workspace lib + integration test binaries + the
      # eez-node binary that integration tests spawn via CARGO_BIN_EXE_).
      # Once this completes, clippy and both nextest runs read from cache.
      # Optimization (not required): the cargo-fuzz bin crate builds fine on
      # stable, but --all-targets would compile libFuzzer's C++ runtime and link
      # two ~1GB binaries that CI never runs (campaigns are local, via
      # crates/eez-fuzz/fuzz.sh). Excluding it just saves CI build time + disk.
      # The harness + oracle ARE covered here via the eez-fuzz lib + integration
      # tests (e2e_cases). Test steps don't need the exclude: the fuzz bins are
      # `test = false`, so --lib / --test '*' never select them.
      - name: Build (tests + binaries)
        run: cargo nextest run --workspace --exclude eez-fuzz-fuzz --all-targets --no-run
      - name: Clippy
        run: cargo clippy --workspace --exclude eez-fuzz-fuzz --all-targets -- -D warnings
      - name: Build contracts (artifacts read by harness)
        working-directory: contracts
        run: forge build
      # The eez-fuzz harness also loads the protocol predeploys (EEZL2, …) from
      # the submodule's own out/ dir, so build them too.
      - name: Build protocol contracts (submodule, artifacts read by harness)
        working-directory: sync-rollups-protocol
        run: forge build
      # Both nextest runs read from the cache populated by the build step.
      # Lib tests parallelise across cores; integration tests serialise to
      # one runner-wide reth+anvil set at a time (memory-bounded).
      - name: Unit tests (lib, parallel)
        run: cargo nextest run --workspace --lib --no-fail-fast
      - name: Integration tests (test '*', serial)
        run: cargo nextest run --workspace --test '*' --test-threads=1 --no-fail-fast
