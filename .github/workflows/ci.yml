name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && format('{0}-{1}', github.event.pull_request.head.repo.full_name, github.head_ref) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # @stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev pkg-config libssl-dev cmake protobuf-compiler
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # @stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: Install nextest
        uses: taiki-e/install-action@fd2f5e3d644b484055ebf4268f474c565f148f25 # v2
        with:
          tool: nextest@0.9.137
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev pkg-config libssl-dev cmake protobuf-compiler
      - name: Unit tests (lib + bins, parallel)
        run: cargo nextest run --locked --workspace --lib --bins --no-fail-fast
      - name: Protocol integration vectors
        run: >-
          cargo nextest run --locked -p eez-protocol
          --test public_inputs_hash_vectors
          --test rolling_hash_vectors
          --no-fail-fast

  contract-tests:
    name: Contract Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1
        with:
          version: v1.7.1
      - name: Test integration contracts
        working-directory: contracts
        run: forge test

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: contracts-out
          path: contracts/out
          retention-days: 1

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # @stable
      - uses: taiki-e/install-action@fd2f5e3d644b484055ebf4268f474c565f148f25 # v2
        with:
          tool: cargo-deny,cargo-audit
      - name: Check dependency policy
        run: cargo deny check bans sources
      - name: Check known vulnerabilities
        run: cargo audit

  build-e2e:
    name: Build E2E Binaries
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # @stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: Install nextest
        uses: taiki-e/install-action@fd2f5e3d644b484055ebf4268f474c565f148f25 # v2
        with:
          tool: nextest@0.9.137
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev pkg-config libssl-dev cmake protobuf-compiler
      - name: Archive integration test executables
        run: |
          mkdir -p artifacts/e2e-build
          cargo nextest archive --locked --cargo-profile ci-e2e -p eez-node-e2e --test e2e --test cross_chain --test chained_interstate --test resumption --test native_system --archive-file artifacts/e2e-build/tests.tar.zst
      - name: Build E2E runtime binaries
        run: |
          cargo build --locked \
            --profile ci-e2e \
            -p eez-node \
            -p eez-follower \
            -p eez-prover-stateless \
            --bins \
            --examples
      - name: Stage E2E runtime binaries
        run: |
          cp target/ci-e2e/eez-composer artifacts/e2e-build/
          cp target/ci-e2e/eez-follower artifacts/e2e-build/
          cp target/ci-e2e/eez-proof-signer artifacts/e2e-build/
          cp target/ci-e2e/examples/genesis_state_root artifacts/e2e-build/eez-genesis-state-root
          cp target/ci-e2e/examples/genesis_block_hash artifacts/e2e-build/eez-genesis-block-hash
          strip artifacts/e2e-build/eez-composer artifacts/e2e-build/eez-follower artifacts/e2e-build/eez-proof-signer artifacts/e2e-build/eez-genesis-state-root artifacts/e2e-build/eez-genesis-block-hash || true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-build
          path: artifacts/e2e-build
          retention-days: 1
          compression-level: 0

  embedded-e2e:
    name: Embedded E2E Tests
    needs: [build-e2e, contract-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 80
    env:
      EEZ_TEST_PROOF_SIGNER_BIN: ${{ github.workspace }}/artifacts/e2e-build/eez-proof-signer
      EEZ_TEST_LOG_DIR: ${{ github.workspace }}/artifacts/embedded-e2e/logs
      EEZ_TEST_DATADIR_DIR: ${{ github.workspace }}/artifacts/embedded-e2e/datadirs
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # @stable
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1
        with:
          version: v1.7.1
      - name: Install nextest
        uses: taiki-e/install-action@fd2f5e3d644b484055ebf4268f474c565f148f25 # v2
        with:
          tool: nextest@0.9.137
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: contracts-out
          path: contracts/out
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: e2e-build
          path: artifacts/e2e-build
      - name: Restore helper executable permissions
        run: |
          chmod +x artifacts/e2e-build/eez-proof-signer artifacts/e2e-build/eez-genesis-state-root artifacts/e2e-build/eez-genesis-block-hash
          echo "$GITHUB_WORKSPACE/artifacts/e2e-build" >> "$GITHUB_PATH"
      - name: Verify generated EEZL2 genesis artifacts
        run: scripts/update-eezl2-genesis.sh --check
      - name: Integration tests (e2e, serial)
        timeout-minutes: 60
        run: |
          mkdir -p artifacts/embedded-e2e
          set +e
          cargo nextest run -P ci --archive-file artifacts/e2e-build/tests.tar.zst --workspace-remap "$GITHUB_WORKSPACE" -E 'binary(=e2e)' --test-threads=1 --no-fail-fast --color=always 2>&1 \
            | tee artifacts/embedded-e2e/nextest.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"
      - name: Upload embedded e2e diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: embedded-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/embedded-e2e/nextest.log
            artifacts/embedded-e2e/logs
          if-no-files-found: warn
          retention-days: 7

  cross-chain-e2e:
    name: Cross-Chain E2E Tests (${{ matrix.suite.name }})
    needs: [build-e2e, contract-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        suite:
          - id: cross-chain
            name: cross-chain
            filter: binary(=cross_chain)
          - id: chained-interstate
            name: chained interstate
            filter: binary(=chained_interstate)
          - id: resumption
            name: resumption
            filter: binary(=resumption)
          - id: native-system
            name: native system
            filter: binary(=native_system)
    env:
      EEZ_TEST_PROOF_SIGNER_BIN: ${{ github.workspace }}/artifacts/e2e-build/eez-proof-signer
      EEZ_TEST_LOG_DIR: ${{ github.workspace }}/artifacts/cross-chain-e2e/${{ matrix.suite.id }}/logs
      EEZ_TEST_DATADIR_DIR: ${{ github.workspace }}/artifacts/cross-chain-e2e/${{ matrix.suite.id }}/datadirs
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # @stable
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1
        with:
          version: v1.7.1
      - name: Install nextest
        uses: taiki-e/install-action@fd2f5e3d644b484055ebf4268f474c565f148f25 # v2
        with:
          tool: nextest@0.9.137
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: contracts-out
          path: contracts/out
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: e2e-build
          path: artifacts/e2e-build
      - name: Restore signer executable permission
        run: chmod +x artifacts/e2e-build/eez-proof-signer
      - name: Integration tests (${{ matrix.suite.name }}, serial)
        timeout-minutes: 75
        run: |
          mkdir -p "artifacts/cross-chain-e2e/${{ matrix.suite.id }}"
          set +e
          cargo nextest run -P ci -p eez-node-e2e --test cross_chain --test chained_interstate --test resumption --test resumption_append --test native_system --test-threads=1 --no-fail-fast --color=always 2>&1 \
            | tee artifacts/cross-chain-e2e/nextest.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"
      - name: Upload cross-chain e2e diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cross-chain-e2e-${{ matrix.suite.id }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/cross-chain-e2e/${{ matrix.suite.id }}/nextest.log
            artifacts/cross-chain-e2e/${{ matrix.suite.id }}/logs
          if-no-files-found: warn
          retention-days: 7

  kurtosis-e2e:
    name: Kurtosis E2E
    needs: [build-e2e, contract-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      KURTOSIS_ENCLAVE: eez-ci
      EEZ_NODE_IMAGE: eez-node:ci
      EEZ_PROOF_SIGNER_IMAGE: eez-proof-signer:ci
      EEZ_DEPLOY_IMAGE: eez-deploy:ci
      EEZ_CI_RESULT_DIR: ${{ github.workspace }}/artifacts/kurtosis-e2e
      EEZ_PREBUILT_BIN_DIR: ${{ github.workspace }}/artifacts/e2e-build
      EEZ_PRUNE_BUILD_CACHE: "1"
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: e2e-build
          path: artifacts/e2e-build
      - name: Restore runtime binary permissions
        run: chmod +x artifacts/e2e-build/eez-composer artifacts/e2e-build/eez-follower artifacts/e2e-build/eez-proof-signer artifacts/e2e-build/eez-genesis-state-root artifacts/e2e-build/eez-genesis-block-hash
      - name: Reclaim runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          docker system prune --all --force
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1
        with:
          version: v1.7.1
      - name: Install Kurtosis
        run: |
          echo "deb [trusted=yes] https://sdk.kurtosis.com/kurtosis-cli-release-artifacts/ /" | sudo tee /etc/apt/sources.list.d/kurtosis.list
          sudo apt-get update
          sudo apt-get install -y bc kurtosis-cli jq openssl
          kurtosis engine start
      - name: Run Enclave
        run: bash testing/kurtosis/run-ci.sh
      - name: Stop kurtosis enclave
        if: always()
        run: bash testing/kurtosis/stop.sh
      - name: Upload kurtosis e2e diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kurtosis-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/kurtosis-e2e
          if-no-files-found: warn
          retention-days: 7
      - name: Remove candidate images
        if: always()
        run: docker image rm "$EEZ_NODE_IMAGE" "$EEZ_PROOF_SIGNER_IMAGE" "$EEZ_DEPLOY_IMAGE" || true
