name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # @stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev pkg-config libssl-dev cmake protobuf-compiler
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --locked --workspace --all-targets -- -D warnings

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # @stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: Install nextest
        uses: taiki-e/install-action@fd2f5e3d644b484055ebf4268f474c565f148f25 # v2
        with:
          tool: nextest@0.9.137
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev pkg-config libssl-dev cmake protobuf-compiler
      - name: Unit tests (lib + bins, parallel)
        run: cargo nextest run --locked --workspace --lib --bins --no-fail-fast
      - name: Protocol integration vectors
        run: >-
          cargo nextest run --locked -p eez-protocol
          --test public_inputs_hash_vectors
          --test rolling_hash_vectors
          --no-fail-fast

  contract-tests:
    name: Contract Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          submodules: recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1
        with:
          version: v1.7.1
      - name: Test integration contracts
        working-directory: contracts
        run: forge test

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: contracts-out
          path: contracts/out
          retention-days: 1

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # @stable
      - uses: taiki-e/install-action@fd2f5e3d644b484055ebf4268f474c565f148f25 # v2
        with:
          tool: cargo-deny,cargo-audit
      - name: Check dependency policy
        run: cargo deny check advisories bans sources
      - name: Check known vulnerabilities
        run: cargo audit

  build-e2e:
    name: Build E2E Binaries
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # @stable
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
      - name: Install nextest
        uses: taiki-e/install-action@fd2f5e3d644b484055ebf4268f474c565f148f25 # v2
        with:
          tool: nextest@0.9.137
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev pkg-config libssl-dev cmake protobuf-compiler
      - name: Build proof signer (launched by harness)
        run: cargo build -p eez-proof-signer --locked
      - name: Archive integration test executables
        run: |
          mkdir -p artifacts/e2e-build
          cargo nextest archive --locked -p eez-node-e2e --test e2e --test cross_chain --test chained_interstate --test resumption --archive-file artifacts/e2e-build/tests.tar.zst
          cp target/debug/eez-proof-signer artifacts/e2e-build/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-build
          path: artifacts/e2e-build
          retention-days: 1
          compression-level: 0

  embedded-e2e:
    name: Embedded E2E Tests
    needs: [build-e2e, contract-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      EEZ_TEST_PROOF_SIGNER_BIN: ${{ github.workspace }}/artifacts/e2e-build/eez-proof-signer
      EEZ_TEST_LOG_DIR: ${{ github.workspace }}/artifacts/embedded-e2e/logs
      EEZ_TEST_DATADIR_DIR: ${{ github.workspace }}/artifacts/embedded-e2e/datadirs
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
          submodules: recursive
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # @stable
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1
        with:
          version: v1.7.1
      - name: Install nextest
        uses: taiki-e/install-action@fd2f5e3d644b484055ebf4268f474c565f148f25 # v2
        with:
          tool: nextest@0.9.137
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: contracts-out
          path: contracts/out
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: e2e-build
          path: artifacts/e2e-build
      - name: Restore signer executable permission
        run: chmod +x artifacts/e2e-build/eez-proof-signer
      - name: Verify generated EEZL2 genesis artifacts
        run: scripts/update-eezl2-genesis.sh --check
      - name: Integration tests (e2e, serial)
        timeout-minutes: 40
        run: |
          mkdir -p artifacts/embedded-e2e
          set +e
          cargo nextest run -P ci --archive-file artifacts/e2e-build/tests.tar.zst --workspace-remap "$GITHUB_WORKSPACE" -E 'binary(=e2e)' --test-threads=1 --no-fail-fast --color=always 2>&1 \
            | tee artifacts/embedded-e2e/nextest.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"
      - name: Upload embedded e2e diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: embedded-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/embedded-e2e/nextest.log
            artifacts/embedded-e2e/logs
          if-no-files-found: warn
          retention-days: 7

  cross-chain-e2e:
    name: Cross-Chain E2E Tests
    needs: [build-e2e, contract-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      EEZ_TEST_PROOF_SIGNER_BIN: ${{ github.workspace }}/artifacts/e2e-build/eez-proof-signer
      EEZ_TEST_LOG_DIR: ${{ github.workspace }}/artifacts/cross-chain-e2e/logs
      EEZ_TEST_DATADIR_DIR: ${{ github.workspace }}/artifacts/cross-chain-e2e/datadirs
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # @stable
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@b00af27efadbc7b4ca8b82abbd903b17cc874d2a # v1
        with:
          version: v1.7.1
      - name: Install nextest
        uses: taiki-e/install-action@fd2f5e3d644b484055ebf4268f474c565f148f25 # v2
        with:
          tool: nextest@0.9.137
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: contracts-out
          path: contracts/out
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: e2e-build
          path: artifacts/e2e-build
      - name: Restore signer executable permission
        run: chmod +x artifacts/e2e-build/eez-proof-signer
      - name: Integration tests (cross-chain, serial)
        timeout-minutes: 75
        run: |
          mkdir -p artifacts/cross-chain-e2e
          set +e
          cargo nextest run -P ci --archive-file artifacts/e2e-build/tests.tar.zst --workspace-remap "$GITHUB_WORKSPACE" -E 'binary(=cross_chain) | binary(=chained_interstate) | binary(=resumption)' --test-threads=1 --no-fail-fast --color=always 2>&1 \
            | tee artifacts/cross-chain-e2e/nextest.log
          status=${PIPESTATUS[0]}
          set -e
          exit "$status"
      - name: Upload cross-chain e2e diagnostics
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cross-chain-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/cross-chain-e2e/nextest.log
            artifacts/cross-chain-e2e/logs
          if-no-files-found: warn
          retention-days: 7
