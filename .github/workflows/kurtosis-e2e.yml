name: Kurtosis E2E

on:
  pull_request:
    branches: [main, chetna/cross-chain-test]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-path-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  kurtosis-e2e:
    name: Kurtosis E2E
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      KURTOSIS_ENCLAVE: eez-pr-${{ github.run_id }}-${{ github.run_attempt }}
      EEZ_NODE_IMAGE: eez-node:ci-${{ github.sha }}
      EEZ_DEPLOY_IMAGE: eez-deploy:ci-${{ github.sha }}
      EEZ_CI_RESULT_DIR: ${{ github.workspace }}/artifacts/production-path-ci
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Initialize submodules
        run: git submodule update --init --recursive
      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@c7450ba673e133f5ee30098b3b54f444d3a2ca2d # v1
      - name: Install Kurtosis
        run: |
          echo "deb [trusted=yes] https://sdk.kurtosis.com/kurtosis-cli-release-artifacts/ /" | sudo tee /etc/apt/sources.list.d/kurtosis.list
          sudo apt-get update
          sudo apt-get install -y kurtosis-cli jq openssl
          kurtosis engine start
      - name: Run Enclave
        run: bash testing/kurtosis/run-ci.sh
      - name: Stop production-path network
        if: always()
        run: bash testing/kurtosis/stop.sh
      - name: Upload production-path diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: production-path-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/production-path-ci
          if-no-files-found: warn
          retention-days: 7
      - name: Remove candidate images
        if: always()
        run: docker image rm "$EEZ_NODE_IMAGE" "$EEZ_DEPLOY_IMAGE" || true
