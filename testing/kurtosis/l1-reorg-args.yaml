# L1-only devnet with injectable reorgs (ethereum-package args).
#
# Same chain id (7331), 12s cadence, and rbuilder/flashbots MEV stack as
# l1-only-args.yaml, but the validators are split into two sides so
# scripts/l1-reorg.sh can partition them and force reorgs:
#
#   participant 1 (el-1/cl-1/vc-1)        - the OBSERVED side, 1/3 of validators.
#                                           Its EL is the canonical RPC that
#                                           tooling and an external L2 use, and
#                                           the MEV builder/relay sit with it.
#   participants 2-3 (el-2..3/cl-2..3)    - the HIDDEN side, 2/3 of validators.
#
# While partitioned, both sides extend their own fork. On heal, fork choice
# moves the observed side onto the heavier hidden fork, orphaning the observed
# side's partition blocks. The hidden side has two nodes so that each side
# keeps a peer (and a synced beacon node) during the partition.
#
#   bash testing/kurtosis/scripts/l1-reorg.sh up
#   bash testing/kurtosis/scripts/l1-reorg.sh run
participants:
  - el_type: reth
    el_image: ghcr.io/paradigmxyz/reth:latest
    cl_type: lighthouse
    cl_image: sigp/lighthouse:v8.1.2
    # Fulu is active at genesis; with fewer than 128 validators per node the
    # package requires supernodes (full data-column custody).
    supernode: true
    count: 1
    validator_count: 32
  - el_type: reth
    el_image: ghcr.io/paradigmxyz/reth:latest
    cl_type: lighthouse
    cl_image: sigp/lighthouse:v8.1.2
    supernode: true
    count: 2
    validator_count: 32

network_params:
  network_id: "7331"
  seconds_per_slot: 12
  slot_duration_ms: 12000
  genesis_gaslimit: 60000000
  min_validator_withdrawability_delay: 1
  shard_committee_period: 1
  deneb_fork_epoch: 0
  electra_fork_epoch: 0
  # Same accounts as l1-only-args.yaml. Must be single-line compact JSON.
  prefunded_accounts: '{"0xb9e79D19f651a941757b35830232E7EFC77E1c79":{"balance":"1000000ETH"},"0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266":{"balance":"1000000ETH"},"0x70997970C51812dc3A010C7d01b50e0d17dc79C8":{"balance":"1000000ETH"},"0x3C44CdDdB6a900fa2b585dd299e03d12FA4293BC":{"balance":"1000000ETH"}}'

mev_type: flashbots
mev_params:
  mev_builder_image: ethpandaops/reth-rbuilder:develop
  mev_relay_image: ethpandaops/mev-boost-relay:main
  mev_boost_image: ethpandaops/mev-boost:develop
  mev_builder_cl_image: sigp/lighthouse:v8.1.2
  mev_builder_subsidy: 1

additional_services:
  - dora
