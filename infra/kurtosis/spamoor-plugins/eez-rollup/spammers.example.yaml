# eez-xchain spammer intent file.
#
# Declare WHICH spammers you want and HOW FAST — nothing else. Copy this to a
# gitignored `spammers.yaml`, edit it, then run:
#
#     bash infra/kurtosis/scripts/spammers.sh up
#
# spammers.sh resolves all the plumbing you never set here: it provisions the
# cross-chain proxies, generates + funds the dedicated inbound (L1) and outbound
# (L2) keys, and fills each entry's proxy/key fields in before starting it. You
# never copy a proxy address or a private key.
#
# Per-entry fields:
#   name        required — label for the spammer
#   enabled     true/false — keep a definition around without running it
#   mode        inbound | outbound | mixed
#   throughput  cross-chain txs per L2 slot (see the note on drain rate below)
#   attack      "" (healthy) | garbage-calldata | revert   (default "")
#   max_wallets optional — child wallets. Omit and the tool picks a bounded
#               default; each wallet is funded ~5 ETH, so this sizes funding.
#   max_pending optional — backpressure cap; omit to let the scenario derive it.
#   value_max   optional — upper bound for the random setValue() arg (healthy).
#
# Drain rate: inbound + outbound share one per-rollup queue drained FIFO. Asking
# for more throughput than the chain drains just grows a backlog (not an error);
# `spammers.sh verify` measures the real rate and warns. Attack entries are
# meant to overload — their backlog is the signal, not a fault.

spammers:
  # Healthy inbound (L1 -> L2) load.
  - name: inbound
    enabled: true
    mode: inbound
    throughput: 3
    max_wallets: 20

  # Healthy outbound (L2 -> L1) load.
  - name: outbound
    enabled: true
    mode: outbound
    throughput: 3
    max_wallets: 20

  # Balanced both-directions load from one entry. Disabled by default — prefer
  # running the two single-direction entries above for independent dials.
  - name: mixed
    enabled: false
    mode: mixed
    throughput: 3
    max_wallets: 20

  # Adversarial: malformed calldata to the inbound proxy. Run ALONGSIDE the
  # healthy inbound entry and watch whether its confirm rate holds.
  - name: attack-garbage
    enabled: false
    mode: inbound
    attack: garbage-calldata
    throughput: 20
    max_wallets: 20

  # Adversarial: valid selector for a function the target lacks -> reverts.
  - name: attack-revert
    enabled: false
    mode: inbound
    attack: revert
    throughput: 20
    max_wallets: 20
