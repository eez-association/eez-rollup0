# Reference template for the spamoor-eez daemon's startup spammers.
#
# NOT loaded by default — the daemon boots with no startup spammers because
# the cross-chain scenario needs proxy addresses that don't exist until after
# deploy. To bake these in on a fresh enclave: copy this to a gitignored
# startup-spammers.yaml, fill in the REPLACE_ME values (proxy addresses from
# wave-test.sh's create_l1_proxy/create_l2_proxy, a funded L2 key), and set
# eez.spamoor_eez.startup_spammer_config to its path in args.yaml. Otherwise,
# add spammers live via the daemon web UI.
#
# The daemon's --rpchost is the NORMAL L1 RPC (wallets are funded there); the
# cross-chain txs themselves are POSTed to the fronts. inbound_front (L1),
# outbound_rpc (normal L2, for funding) and outbound_front (L2) all default to
# the enclave-internal eez-node ports, so they're omitted below.
#
# This shows the recommended two-spammer setup (independent inbound + outbound)
# plus an adversarial spammer. Enable/disable per run by including/removing
# entries or toggling them in the UI. Do NOT put an L1-baseline eoatx spammer
# here — plain L1 load is already produced by ethereum_package's own spamoor
# (args.example.yaml spamoor_params), and this daemon only reaches the fronts.

# Note: filling these REPLACE_ME values by hand is the manual path. The easy
# path is `bash infra/kurtosis/scripts/spammers.sh up`, which provisions every
# address/key and injects them for you — see the plugin README.
#
# `ops` selects which cross-chain op kinds each spammer cycles through
# (set/noret/value/wrapper). Only the proxies/wrapper for the listed ops are
# required; omit ops for setter-only (then only *_proxy is needed).

- scenario: eez-xchain
  name: "EEZ Inbound (L1->L2)"
  config:
    mode: inbound
    throughput: 20
    max_pending: 200
    max_wallets: 40
    ops: [set, noret, value, wrapper]
    inbound_proxy: "REPLACE_ME"         # L1 setter CrossChainProxy (op: set)
    inbound_noret_proxy: "REPLACE_ME"   # L1 ValueNoRet CrossChainProxy (op: noret)
    inbound_deposit_proxy: "REPLACE_ME" # L1 recipient proxy for value transfers (op: value)
    inbound_wrapper: "REPLACE_ME"       # L1 wrapper over the setter proxy (op: wrapper)

- scenario: eez-xchain
  name: "EEZ Outbound (L2->L1)"
  config:
    mode: outbound
    throughput: 20
    max_pending: 200
    max_wallets: 40
    ops: [set, noret, value, wrapper]
    outbound_private_key: "REPLACE_ME"      # funded L2 key (NOT an eez-node system key)
    outbound_proxy: "REPLACE_ME"            # L2 setter CrossChainProxy (op: set)
    outbound_noret_proxy: "REPLACE_ME"      # L2 ValueNoRet CrossChainProxy (op: noret)
    outbound_withdraw_proxy: "REPLACE_ME"   # L2 recipient proxy for value transfers (op: value)
    outbound_wrapper: "REPLACE_ME"          # L2 wrapper over the setter proxy (op: wrapper)
    # outbound_rpc / outbound_front default to eez-node's :18688 / :18998 — override only if changed

# Adversarial spammer (DDoS-resilience). Run alongside the healthy ones and
# watch whether their inclusion rate degrades. attack: garbage-calldata | revert.
- scenario: eez-xchain
  name: "EEZ Attack (garbage inbound)"
  config:
    attack: garbage-calldata
    mode: inbound
    throughput: 40
    max_pending: 400
    max_wallets: 40
    inbound_proxy: "REPLACE_ME" # a pre-created L1 proxy to hammer
