# Pair A's follower beacon — BEACON ONLY (no validators). The Kurtosis
# validators (Pair B) propose every block, incl. rbuilder's; this follower
# receives them over CL P2P and drives eez-node's embedded reth via the engine
# API. Started by eez-up.sh; paths are relative to infra/kurtosis/.
services:
  beacon:
    image: sigp/lighthouse:v8.1.2
    container_name: eez-unified-lighthouse-bn
    restart: unless-stopped
    stop_grace_period: 30s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./eez-l1-data/cl:/testnet:ro
      - ./eez-l1-data/jwt/jwtsecret:/jwt/jwtsecret:ro
      - ./eez-l1-data/bn-data:/data
    command:
      - lighthouse
      - beacon_node
      - --testnet-dir=/testnet
      - --datadir=/data
      - --listen-address=0.0.0.0
      - --port=9400
      - --quic-port=9401
      - --http
      - --http-address=0.0.0.0
      - --http-port=5252
      # eez-node's embedded reth authrpc on the host (18551, not 18546 = reth WS).
      - --execution-endpoint=http://host.docker.internal:${EEZ_L1_AUTH_PORT:-18551}
      - --jwt-secrets=/jwt/jwtsecret
      # discv5 bans private-IP ENRs, so we dial the Kurtosis CLs directly by
      # libp2p multiaddr (same trick as docker-compose.chiado.yml); the ENR
      # boot-node is kept but expected to be table-filtered out.
      - --boot-nodes=${EEZ_L1_CL_BOOTNODE:?set via infra/kurtosis/eez-l1-data/cl-bootnode.env (run get-cl-bootnode.sh)}
      - --libp2p-addresses=${EEZ_L1_CL_LIBP2P:?set via infra/kurtosis/eez-l1-data/cl-bootnode.env (run get-cl-bootnode.sh)}
      - --disable-packet-filter
      - --subscribe-all-subnets
      - --suggested-fee-recipient=${DEVNET_FEE_RECIPIENT:-0x0000000000000000000000000000000000000000}
    networks:
      - enclave
    logging:
      driver: "local"

# The enclave's Docker network, created by kurtosis-up.sh (kt-<enclave>).
networks:
  enclave:
    name: kt-${KURTOSIS_ENCLAVE:-eez-devnet}
    external: true
