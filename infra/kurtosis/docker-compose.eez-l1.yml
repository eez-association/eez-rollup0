# Follower Lighthouse beacon for the eez-node embedded-L1 pair (Pair A) in the
# unified Kurtosis harness. BEACON ONLY — no validator client, no keys.
#
# Why beacon-only: every L1 block (including rbuilder's winning block via the
# relay) is proposed by the Kurtosis validators (Pair B). This follower just
# receives them over CL P2P and drives eez-node's embedded reth via the engine
# API, so eez-node executes the exact same blocks — and EvmComposer reads the
# bundle-included L1 state in-process. If this had validators, half the slots
# would be plain local payloads instead of rbuilder blocks.
#
# Networking:
#   - Joins the enclave's Docker network (kt-<enclave>) so it can reach the
#     Kurtosis CLs' P2P (the ENR from get-cl-bootnode.sh resolves there).
#   - Reaches eez-node's authrpc on the HOST via host.docker.internal (eez-node
#     runs on the host via `cargo run`, per run-eez-embedded.sh).
#
# Prereqs (in order):
#   bash scripts/extract-genesis.sh     # -> eez-l1-data/{genesis.json,cl/,jwt}
#   bash scripts/get-cl-bootnode.sh     # -> eez-l1-data/cl-bootnode.env
# Run:
#   docker compose --env-file infra/kurtosis/.env \
#     --env-file infra/kurtosis/eez-l1-data/cl-bootnode.env \
#     -f infra/kurtosis/docker-compose.eez-l1.yml up -d
#
# Volume paths are relative to infra/kurtosis/ (where this file lives).
services:
  beacon:
    image: sigp/lighthouse:v8.1.2
    container_name: eez-unified-lighthouse-bn
    restart: unless-stopped
    stop_grace_period: 30s
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./eez-l1-data/cl:/testnet:ro
      - ./eez-l1-data/jwt/jwtsecret:/jwt/jwtsecret:ro
      - ./eez-l1-data/bn-data:/data
    command:
      - lighthouse
      - beacon_node
      - --testnet-dir=/testnet
      - --datadir=/data
      - --listen-address=0.0.0.0
      - --port=9400
      - --quic-port=9401
      - --http
      - --http-address=0.0.0.0
      - --http-port=5252
      # eez-node's embedded reth authrpc on the host (EEZ_L1_AUTH_PORT=18551;
      # NOT 18545+1=18546, which reth uses for its WS server).
      - --execution-endpoint=http://host.docker.internal:${EEZ_L1_AUTH_PORT:-18551}
      - --jwt-secrets=/jwt/jwtsecret
      # Peer into the Kurtosis CL network so we follow the real head. Unlike the
      # single-node infra/devnet-l1 beacon, this is NOT --allow-insecure-genesis-
      # sync: it must find the Kurtosis CLs and sync from them.
      - --boot-nodes=${EEZ_L1_CL_BOOTNODE:?set via infra/kurtosis/eez-l1-data/cl-bootnode.env (run get-cl-bootnode.sh)}
      - --disable-packet-filter
      - --subscribe-all-subnets
      - --suggested-fee-recipient=${DEVNET_FEE_RECIPIENT:-0x0000000000000000000000000000000000000000}
    networks:
      - enclave
    logging:
      driver: "local"

# The enclave's Docker network, created by kurtosis-up.sh. VERIFY the name with
# `docker network ls | grep kt-` — it is kt-<enclave> (default kt-eez-devnet).
networks:
  enclave:
    name: kt-${KURTOSIS_ENCLAVE:-eez-devnet}
    external: true
