# Kurtosis args for ethpandaops/ethereum-package (12s L1, reth-rbuilder, spamoor).
# Launch: infra/kurtosis/scripts/kurtosis-up.sh

participants:
  - el_type: reth
    el_image: ghcr.io/paradigmxyz/reth:latest
    cl_type: lighthouse
    cl_image: sigp/lighthouse:v8.1.2
    count: 2
  - el_type: reth
    cl_type: lighthouse
    count: 2

network_params:
  network_id: "7331"
  seconds_per_slot: 12
  slot_duration_ms: 12000
  genesis_gaslimit: 60000000
  min_validator_withdrawability_delay: 1
  shard_committee_period: 1
  deneb_fork_epoch: 0
  electra_fork_epoch: 0
  prefunded_accounts: '{"0xb9e79D19f651a941757b35830232E7EFC77E1c79": {"balance": "100ETH"}}'

mev_type: flashbots
mev_params:
  mev_builder_image: ethpandaops/reth-rbuilder:develop
  mev_relay_image: ethpandaops/mev-boost-relay:main
  mev_boost_image: ethpandaops/mev-boost:develop
  mev_builder_cl_image: sigp/lighthouse:v8.1.2
  mev_builder_subsidy: 1

additional_services:
  - spamoor      # L1 blockspace load (tune throughput below)
  - disruptoor   # reorg primitive; driven by scripts/reorg-scheduler.sh (needs --privileged)
  - dora         # block/reorg explorer — confirm reorg depth visually
  - forkmon      # fork-choice / reorg monitor across the 4 CL nodes

# Disruptoor starts healthy (no partitions). scripts/reorg-scheduler.sh drives
# it at runtime via the HTTP API (PUT /v1/state, POST /v1/state/clear), using:
#   minority = participants 3,4   majority = participants 1,2   component = cl

# L1 blockspace load. throughput = txs/block/spammer; 850 eoatx ≈ 30% of the
# 60M gas limit (21k gas/eoatx) — mid-range of the Phase-3 target band
# (10-50%), leaving room for EEZ postBatch bundles. Tuning math + live-adjust
# via the spamoor UI: see README "Spamoor". Re-run kurtosis-up.sh to apply a
# static change, or use the spamoor web UI for live retuning without restart.
spamoor_params:
  spammers:
    - scenario: eoatx
      name: baseline-load
      config:
        throughput: 850

port_publisher:
  el:
    enabled: true
    public_port_start: 32000
  # Publish CL beacon-API ports to the host so the unified harness can read a
  # Kurtosis beacon's ENR (GET /eth/v1/node/identity) to boot the eez-node
  # follower beacon into this CL P2P network. See scripts/get-cl-bootnode.sh.
  cl:
    enabled: true
    public_port_start: 33000
  mev:
    enabled: true
    public_port_start: 37000
  # Exposes disruptoor HTTP API + dora + forkmon + spamoor UI to the host so
  # reorg-scheduler.sh and parse-endpoints.sh can reach them.
  additional_services:
    enabled: true
    public_port_start: 36000
