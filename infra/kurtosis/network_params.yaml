# Kurtosis args for ethpandaops/ethereum-package (12s L1, reth-rbuilder, spamoor).
# Launch: infra/kurtosis/scripts/kurtosis-up.sh

participants:
  - el_type: reth
    el_image: ghcr.io/paradigmxyz/reth:latest
    cl_type: lighthouse
    cl_image: sigp/lighthouse:v8.1.2
    count: 2
  - el_type: reth
    cl_type: lighthouse
    count: 2

network_params:
  network_id: "7331"
  # Must equal EEZ_L1_BLOCK_TIME_MS (12000) so the bundle timestamp pin lands
  # on-grid: min==max==parent_ts+12 == the next slot's timestamp.
  seconds_per_slot: 12
  slot_duration_ms: 12000
  genesis_gaslimit: 60000000
  min_validator_withdrawability_delay: 1
  shard_committee_period: 1
  deneb_fork_epoch: 0
  electra_fork_epoch: 0
  prefunded_accounts: '{"0xb9e79D19f651a941757b35830232E7EFC77E1c79": {"balance": "1000000ETH"}}'

mev_type: flashbots
mev_params:
  # Flashbots' in-process rbuilder (the reth-rbuilder crate); ethpandaops just
  # publishes the image — Flashbots ships no reth-rbuilder image of its own.
  mev_builder_image: ethpandaops/reth-rbuilder:develop
  mev_relay_image: ethpandaops/mev-boost-relay:main
  mev_boost_image: ethpandaops/mev-boost:develop
  mev_builder_cl_image: sigp/lighthouse:v8.1.2
  # 1 ETH/winning-block from the builder coinbase so rbuilder outbids local
  # payloads and wins slots. Coinbase funded in prefunded_accounts above.
  mev_builder_subsidy: 1

additional_services:
  - spamoor      # L1 blockspace load (tune throughput below)
  - disruptoor   # reorg primitive; driven by scripts/reorg-scheduler.sh (needs --privileged)
  - dora         # block/reorg explorer
  - forkmon      # fork-choice monitor across the CL nodes

# reorg-scheduler.sh drives disruptoor at runtime (minority 3,4 | majority 1,2).

# L1 load. throughput = txs/block/spammer; 850 eoatx ≈ 30% of the 60M gas limit,
# leaving room for postBatch bundles. Retune live via the spamoor UI.
spamoor_params:
  spammers:
    - scenario: eoatx
      name: baseline-load
      config:
        throughput: 850

port_publisher:
  el:
    enabled: true
    public_port_start: 32000
  # Publishes CL beacon APIs so get-cl-bootnode.sh can read a peer's ENR.
  cl:
    enabled: true
    public_port_start: 33000
  mev:
    enabled: true
    public_port_start: 37000
  # Exposes disruptoor/dora/spamoor UIs so the scripts can reach them.
  additional_services:
    enabled: true
    public_port_start: 36000
