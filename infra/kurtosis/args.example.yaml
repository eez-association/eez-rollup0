# Template for args.yaml (gitignored).
# up.sh copies this on first run and fills poster_key/proof_signer_key.
#
# Blocks:
#   ethereum_package: passed to ethpandaops/ethereum-package for the shared L1.
#   eez: EEZ images, keys, timing, and L2 config.
ethereum_package:
  participants:
    - el_type: reth
      el_image: ghcr.io/paradigmxyz/reth:latest
      cl_type: lighthouse
      cl_image: sigp/lighthouse:v8.1.2
      count: 2
    - el_type: reth
      cl_type: lighthouse
      cl_image: sigp/lighthouse:v8.1.2
      count: 2

  network_params:
    network_id: "7331"
    # Must match eez.l1_block_time_ms.
    seconds_per_slot: 12
    slot_duration_ms: 12000
    genesis_gaslimit: 60000000
    min_validator_withdrawability_delay: 1
    shard_committee_period: 1
    deneb_fork_epoch: 0
    electra_fork_epoch: 0
    # Builder coinbase.
    prefunded_accounts: '{"0xb9e79D19f651a941757b35830232E7EFC77E1c79": {"balance": "1000000ETH"}}'

  ethereum_genesis_generator_params:
    image: ethpandaops/ethereum-genesis-generator:6.1.4

  mev_type: flashbots
  mev_params:
    mev_builder_image: ethpandaops/reth-rbuilder:develop
    mev_relay_image: ethpandaops/mev-boost-relay:main
    mev_boost_image: ethpandaops/mev-boost:develop
    mev_builder_cl_image: sigp/lighthouse:v8.1.2
    mev_builder_subsidy: 1

  additional_services:
    - spamoor      # L1 load
    - disruptoor   # reorg primitive
    - assertoor
    - dora
    - forkmon

  # Flags unintended reorgs during baseline/load runs.
  assertoor_params:
    run_stability_check: true
    run_block_proposal_check: true

  spamoor_params:
    spammers:
      - scenario: eoatx
        name: baseline-load
        config:
          throughput: 30

eez:
  # Images built locally by up.sh.
  eez_node_image: eez-node:dev
  deploy_image: eez-deploy:dev
  follower_image: sigp/lighthouse:v8.1.2

  # Derived from the dev mnemonic on first run.
  poster_key: "0xCHANGE_ME"
  proof_signer_key: "0xCHANGE_ME"

  # L2 time must divide L1 time with K >= 2.
  l1_block_time_ms: 12000
  l2_block_time_ms: 2000
  proof_time_ms: 5000
  submission_slack_ms: 2500
  max_speculative_depth: 0
  # Maximum cross-chain user transactions drained into one postBatch bundle.
  max_user_txs_per_bundle: 10

  # Fee recipient.
  fee_recipient: "0x0000000000000000000000000000000000000000"

  # L2 (eez-node's own rollup reth).
  l2_system_key: "0xac0974bec39a17e36ba4a6b4d238ff944bacb478cbed5efcae784d7bf4f2ff80"
  l2_system_address: "0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266"
  ccm_l2_address: "0x4200000000000000000000000000000000000007"
  # Must include network_params.network_id.
  cross_chain_source_chain_ids: "7331"

  # Optional overrides.
  # Route bundle submission through the relay so mev-boost can see bids.
  relay_url: "http://mev-relay-api:9062"

  # One cross-chain load daemon per source chain. See spamoor-plugins/README.md.
  spamoor_eez:
    enabled: true
    # Master commit e214fd1; the plugin is compiled against the host's Go APIs.
    image: "ethpandaops/spamoor@sha256:24818bf7ab76696b2dccb0c59cb419cce358cf1b4326a545012b031afd11658b"
    # Dedicated roots for the L1/inbound and L2/outbound daemons. up.sh derives
    # indices 3 and 4; genesis prefunds inbound on L1, while spammers.sh funds
    # outbound on L2 before creating scenarios.
    inbound_private_key: "0xCHANGE_ME"
    outbound_private_key: "0xCHANGE_ME"
    # inbound_startup_spammer_config: "./spamoor-plugins/startup-spammers-inbound.yaml"
    # outbound_startup_spammer_config: "./spamoor-plugins/startup-spammers-outbound.yaml"
