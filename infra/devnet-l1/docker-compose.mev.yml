# Phase 2 — real flashbots/rbuilder, layered on the Phase 1 CL
# (docker-compose.cl.yml). Run both together:
#
#   docker compose --env-file .env -f docker-compose.cl.yml -f docker-compose.mev.yml up
#
# Deployment mirrors flashbots/rbuilder's own model (README + config-playground):
#   builder-reth   — a plain reth node (the builder's EL), IPC + shared datadir
#   rbuilder-beacon— a lighthouse driving builder-reth's forkchoice
#   rbuilder       — the standalone `rbuilder run config.toml` process; reads
#                    builder-reth's datadir + IPC, serves eth_sendBundle,
#                    submits blocks to test-relay
#   test-relay     — rbuilder's one-binary MEV-Boost relay (no redis/postgres;
#                    a single-operator devnet has no builder/proposer trust
#                    boundary, so the production relay is unnecessary)
# and it OVERRIDES the Phase 1 beacon to fetch payloads from test-relay.
#
# NOT yet validated on a Docker host. `VERIFY:` marks values to confirm against
# the pinned images on first bring-up. The canonical local reference is
# flashbots' `builder-playground` tool if this needs debugging.
services:
  # Override: prefer builder payloads from test-relay over local builds.
  beacon:
    command:
      - lighthouse
      - beacon_node
      - --testnet-dir=/testnet
      - --datadir=/data
      - --listen-address=0.0.0.0
      - --port=9400
      - --quic-port=9401
      - --http
      - --http-address=127.0.0.1
      - --http-port=5252
      - --execution-endpoint=http://127.0.0.1:${EEZ_L1_AUTH_PORT:-18546}
      - --jwt-secrets=/jwt/jwtsecret
      - --allow-insecure-genesis-sync
      - --disable-packet-filter
      - --subscribe-all-subnets
      - --suggested-fee-recipient=${DEVNET_FEE_RECIPIENT:-0x0000000000000000000000000000000000000000}
      # VERIFY: single-relay devnet — lighthouse --builder points straight at
      # test-relay; if it won't, put a mev-boost sidecar in between.
      - --builder=http://127.0.0.1:${DEVNET_RELAY_PORT:-9062}
      - --always-prefer-builder-payload

  # Builder's EL: a plain reth, own datadir + IPC (shared with rbuilder via the
  # rbuilder-data volume). Own reth version ⇒ no Cargo conflict with eez-node.
  builder-reth:
    image: ghcr.io/paradigmxyz/reth:latest
    container_name: eez-devnet-builder-reth
    network_mode: host
    restart: unless-stopped
    volumes:
      - ${DEVNET_DATA_DIR:?set DEVNET_DATA_DIR}/rbuilder-data:/data
      - ${DEVNET_DATA_DIR:?}/metadata:/testnet:ro
      - ${DEVNET_JWT_FILE:?set DEVNET_JWT_FILE}:/jwt/jwtsecret:ro
    # VERIFY: ports 28545/28546 must not collide with eez-node's 18545/18546.
    command:
      - node
      - --chain=/testnet/genesis.json
      - --datadir=/data
      - --ipcpath=/data/reth.ipc
      - --http
      - --http.addr=0.0.0.0
      - --http.port=28545
      - --authrpc.addr=0.0.0.0
      - --authrpc.port=28546
      - --authrpc.jwtsecret=/jwt/jwtsecret

  # Builder's CL: drives builder-reth's forkchoice (follower, no validator).
  # VERIFY: peer with the Phase 1 beacon (single-host ENR/peer list) so both
  # follow one chain; ports 9500/5352 kept clear of the Phase 1 beacon.
  rbuilder-beacon:
    image: sigp/lighthouse:v8.1.2
    container_name: eez-devnet-rbuilder-beacon
    network_mode: host
    restart: unless-stopped
    depends_on:
      builder-reth:
        condition: service_started
    volumes:
      - ${DEVNET_DATA_DIR:?}/rbuilder-bn-data:/data
      - ${DEVNET_DATA_DIR:?}/metadata:/testnet:ro
      - ${DEVNET_JWT_FILE:?}:/jwt/jwtsecret:ro
    command:
      - lighthouse
      - beacon_node
      - --testnet-dir=/testnet
      - --datadir=/data
      - --listen-address=0.0.0.0
      - --port=9500
      - --quic-port=9501
      - --http
      - --http-address=127.0.0.1
      - --http-port=5352
      - --execution-endpoint=http://127.0.0.1:28546
      - --jwt-secrets=/jwt/jwtsecret
      - --allow-insecure-genesis-sync
      - --disable-packet-filter

  # test-relay: rbuilder's standalone relay. Validates submitted blocks against
  # builder-reth's RPC and tracks duties/head from a beacon.
  # VERIFY: exact listen flag/port; whether an upstream --relay is required
  # (README example passed one) or omittable for a fully-local devnet.
  test-relay:
    image: flashbots/rbuilder:latest
    container_name: eez-devnet-test-relay
    network_mode: host
    restart: unless-stopped
    depends_on:
      rbuilder-beacon:
        condition: service_started
    command:
      - test-relay
      - --validation-url=http://127.0.0.1:28545
      - --cl-clients=http://127.0.0.1:5352

  # rbuilder: the standalone builder. Shares builder-reth's datadir + IPC,
  # serves eth_sendBundle on :28645 (EEZ_L1_BUILDER_RPC_URL), submits to
  # test-relay per config/rbuilder.toml.
  rbuilder:
    image: flashbots/rbuilder:latest
    container_name: eez-devnet-rbuilder
    network_mode: host
    restart: unless-stopped
    depends_on:
      test-relay:
        condition: service_started
    environment:
      DEVNET_RELAY_PORT: ${DEVNET_RELAY_PORT:-9062}
      DEVNET_BUILDER_COINBASE_KEY: ${DEVNET_BUILDER_COINBASE_KEY:?}
      DEVNET_BUILDER_RELAY_KEY: ${DEVNET_BUILDER_RELAY_KEY:?}
    volumes:
      - ${DEVNET_DATA_DIR:?}/rbuilder-data:/data
      - ${DEVNET_DATA_DIR:?}/metadata:/testnet:ro
      - ./config/rbuilder.toml:/config/rbuilder.toml:ro
    # VERIFY: rbuilder does not expand ${...} inside the TOML itself — if the
    # relay url / key envs don't interpolate, render the config or pass them
    # as rbuilder's own env-var reads (`env:NAME`, already used for the keys).
    command:
      - run
      - /config/rbuilder.toml
