# rbuilder config for the devnet builder, mounted at /config/rbuilder.toml and
# run as `rbuilder run /config/rbuilder.toml`. Fields mirror flashbots/rbuilder
# examples/config/rbuilder/{config-playground,config-live-example}.toml — keep
# them in sync with the pinned rbuilder image tag.
#
# rbuilder reads the builder reth's DB directly (reth_datadir) + IPC
# (el_node_ipc_path), so it shares a volume with the builder-reth container.
# The one field eez-node depends on is jsonrpc_server_port — the eth_sendBundle
# intake that EEZ_L1_BUILDER_RPC_URL points at.

chain = "/testnet/genesis.json"
reth_datadir = "/data"
el_node_ipc_path = "/data/reth.ipc"

# eth_sendBundle intake — target of EEZ_L1_BUILDER_RPC_URL.
jsonrpc_server_ip = "0.0.0.0"
jsonrpc_server_port = 28645

# Devnet-only signing keys (never reuse the poster/proof keys). `env:NAME`
# reads from the process env; a raw hex literal also works.
coinbase_secret_key = "env:DEVNET_BUILDER_COINBASE_KEY"
relay_secret_key = "env:DEVNET_BUILDER_RELAY_KEY"

live_builders = ["mgp-ordering"]
enabled_relays = ["devnet-test-relay"]

# The single self-hosted test-relay.
[[relays]]
name = "devnet-test-relay"
url = "http://127.0.0.1:${DEVNET_RELAY_PORT}"
mode = "full"
