[profile.default]
src         = "src"
test        = "test"
script      = "script"
out         = "out"
# Match the eez-core-protocol submodule's compile settings exactly so
# bytecode is byte-identical between this project's build and the
# submodule's own. Drift here surfaces as CREATE2 mismatches at deploy
# time and proof-vs-on-chain divergence.
solc        = "0.8.34"
optimizer   = true
optimizer_runs = 1
via_ir      = true

# Pull `forge-std` from the submodule's vendored copy, and include
# `eez-core-protocol` as a library lookup path so Foundry discovers
# EEZ.sol / Rollup.sol / IProofSystem.sol / interfaces / periphery
# contracts and compiles them with the same settings as above.
libs = [
    "../eez-core-protocol/lib",
    "../eez-core-protocol",
]

# Auto-detected remappings contain the checkout's absolute path. Besides
# changing the Solidity metadata hash between the host and deployment image,
# those paths make Blockscout's standard-JSON input refer to source names that
# are not present in the request. Keep every external import relative instead.
auto_detect_remappings = false

# `eez-core-protocol/src/...` imports resolve to the submodule.
# Matches the pattern in /root/rollup-node/deployments/devnet/foundry.toml.
remappings = [
    "eez-core-protocol/=../eez-core-protocol/",
    "@openzeppelin/contracts/=../eez-core-protocol/lib/openzeppelin-contracts/contracts/",
    "forge-std/=../eez-core-protocol/lib/forge-std/src/",
]

[fmt]
line_length = 120
tab_width   = 4
bracket_spacing = false
int_types   = "long"
multiline_func_header = "all"
quote_style = "double"
number_underscore = "preserve"
