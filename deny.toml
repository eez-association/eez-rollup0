# cargo-deny policy for the `Dependency Audit` CI job
# (`cargo deny check bans sources`). We build against a pinned reth
# revision plus several git forks, so dependency drift is the main supply-chain
# risk this job exists to catch: anything NOT listed below fails the build.

[advisories]
version = 2
# `spin 0.9.8` is yanked and reachable only through postcard/heapless and
# test-fuzz; a yank is not a vulnerability, so surface it without failing.
yanked = "warn"
# Only flag unmaintained crates we depend on directly. The reth tree drags in
# six transitively (paste, bitmaps, bincode, atomic-polyfill, number_prefix,
# proc-macro-error2) that we cannot drop without upstream moving first.
unmaintained = "workspace"
# Accepted for now, each with a reason. Revisit on every reth bump — the point
# of the job is that a NEW advisory outside this list turns CI red.
ignore = [
    # zstd 0.13 / zstd-safe 7 / zstd-sys 2.0. The fixes need zstd 0.14 and
    # zstd-safe 8; reth and reth_gnosis still require zstd 0.13.
    # Context reuse through `with_context`, which no dependency calls.
    "RUSTSEC-2026-0391",
    # `Seekable::decompress`, behind the `seekable` feature, which nothing enables.
    "RUSTSEC-2026-0398",
    # A failed legacy-frame stream decode into a `Vec`. Untrusted zstd input only
    # reaches reth's RPC request decompression (off by default) and
    # compression-codecs, which decodes into fixed buffers.
    "RUSTSEC-2026-0403",
    # The wasm32 allocator shim; we don't build for wasm32.
    "RUSTSEC-2026-0410",
    # anyhow `Error::downcast_mut()` unsoundness. Transitive; we never
    # downcast_mut an anyhow error.
    "RUSTSEC-2026-0190",
    # hickory-proto NSEC3 unbounded loop and O(n^2) name-compression DoS.
    # Reached via reth's p2p DNS discovery, which we do not enable.
    "RUSTSEC-2026-0118",
    "RUSTSEC-2026-0119",
    # imbl-sized-chunks double free when a stored element's `Drop` panics.
    # Reached via reth's tx pool, which stores plain data; imbl pins 0.1.3.
    "RUSTSEC-2026-0292",
    # crypto-bigint 0.5 timing variability in constant-time ops. Reachable: our
    # keys sign through alloy's k256 0.13, whose scalar add/sub use it. The fix
    # (>= 0.7.6) needs k256/p256 0.14, which alloy and revm don't use yet.
    "RUSTSEC-2026-0387",
    # zstd 0.13 context-reuse leak; patched in 0.14.3. Pinned reth and
    # compression-codecs require 0.13. Temporary exception until they migrate;
    # reth-zstd-compressors uses bulk, not the affected with_context API.
    "RUSTSEC-2026-0391",
    # zstd-safe seekable decompression; the seekable feature is not enabled.
    # Remove with the upstream zstd-safe 8 migration (patched in 8.2.0).
    "RUSTSEC-2026-0398",
    # zstd-safe legacy streaming error exposes uninitialized output. Pinned
    # dependencies require 7; patched in 8.2.0. Temporary exception pending
    # upstream migration: legacy is enabled, so streaming exposure is not
    # ruled out. Bulk and read APIs are unaffected by this advisory.
    "RUSTSEC-2026-0403",
]

[bans]
# A reth dependency tree legitimately carries many duplicate versions; failing
# on that would make this job noise rather than signal.
multiple-versions = "allow"
# Git dependencies carry no version requirement, which cargo-deny reports
# as a wildcard; their exact commits are pinned in Cargo.lock.
# Report it, do not fail on it — `sources` below is the real gate for those.
wildcards = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
# Every git source in Cargo.lock must be listed here, so adding a new fork is a
# deliberate, reviewed change rather than a silent one.
allow-git = [
    "https://github.com/paradigmxyz/reth",
    # reth v2.7.0 declares revmc (its `jit` backend) as a git dependency.
    "https://github.com/paradigmxyz/revmc",
    # Interim reth fork carrying the genesis-unwind fix; see Cargo.toml [patch].
    "https://github.com/debjit-bw/reth",
    "https://github.com/eez-association/stateless",
    "https://github.com/gnosischain/reth_gnosis",
    "https://github.com/gnosischain/rust-primitives.git",
    "https://github.com/sigp/discv5",
]
