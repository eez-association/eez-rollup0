# eez L2 against an external Kurtosis devnet L1 (12s blocks, chain 7331).
#
# eez-node embeds a reth L1 that joins the enclave as a trusted peer, a
# lighthouse follower drives that reth over the engine API, and the composer,
# L2 and cross-chain fronts run on top. Bundles go to the enclave's rbuilder;
# eez-proof-signer validates windows remotely. All host networking.
#
# Setup and the enclave values this needs: .env.kurtosis.example.
#   docker compose --env-file .env.kurtosis -f docker-compose.kurtosis-node.yml up -d
#
# L1 12s / L2 2s, so K=6. The embedded L1 uses 18645/18661 rather than reth's
# defaults so it can coexist with another reth on the host.

# Own project name, so `up`/`down` here cannot recreate or stop the services of
# another compose file in this directory.
name: kurtosisnode

services:
  eez-proof-signer:
    build:
      context: .
      dockerfile: Dockerfile.signer
    image: eez-proof-signer:local
    container_name: eez-proof-signer-kurtosis
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 11m
    env_file:
      - ./deployments.env
    environment:
      EEZ_PROOF_SIGNER_ADDR: 127.0.0.1:${EEZ_SIGNER_PORT:-50081}
      EEZ_CHAIN_CONFIG: /app/genesis.json
      EEZ_PROOF_SIGNER_KEY: "${EEZ_PROOF_SIGNER_KEY:?set EEZ_PROOF_SIGNER_KEY}"
      EEZ_L2_SYSTEM_KEY: "${EEZ_L2_SYSTEM_KEY:?set EEZ_L2_SYSTEM_KEY}"
      RUST_LOG: "${EEZ_PROOF_SIGNER_RUST_LOG:-info}"
    volumes:
      - ${FRESH_GENESIS:?deploy writes ./datadir/genesis.json}:/app/genesis.json:ro
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "${EEZ_SIGNER_PORT:-50081}"]
      interval: 5s
      timeout: 2s
      retries: 12
    logging:
      driver: "local"

  eez-node:
    build:
      context: .
      dockerfile: Dockerfile
    image: eez-node:local
    container_name: eez-node-kurtosis
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      eez-proof-signer:
        condition: service_healthy
    # Runtime settings come from one role-specific file.
    environment:
      RUST_LOG: "${EEZ_NODE_RUST_LOG:-info}"
    volumes:
      - ${L1_GENESIS_DIR:?point at the enclave's l1-genesis artifact}:/genesis:ro
      - ${L2_DATA_DIR:?set L2_DATA_DIR}:/l2
      - ${JWT_FILE:?openssl rand -hex 32 > this}:/jwt/jwt.hex:ro
      - ${FRESH_GENESIS:?deploy writes ./datadir/genesis.json}:/app/genesis.json:ro
      - ${EEZ_COMPOSER_CONFIG:?set EEZ_COMPOSER_CONFIG}:/app/eez-composer.toml:ro
    command:
      - node
      - --chain=/app/genesis.json
      - --datadir=/l2
      - --eez.config=/app/eez-composer.toml
      - --http
      - --http.addr=0.0.0.0
      - --http.port=18688
      - --http.api=eth,net,web3
      - --authrpc.addr=127.0.0.1
      - --authrpc.port=18684
      - --port=30640
      - --discovery.port=30640
      - --discovery.v5.port=30641
      - --ipcdisable
      - --disable-discovery
      - --db.read-transaction-timeout=0
      - --engine.persistence-threshold=256
      - --engine.memory-block-buffer-target=128
    logging:
      driver: "local"

  lighthouse:
    image: sigp/lighthouse:v8.1.2
    container_name: eez-kurtosis-follower
    network_mode: host
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      - eez-node
    volumes:
      - ${L1_GENESIS_DIR}:/testnet:ro
      - ${JWT_FILE}:/jwt/jwt.hex:ro
    command:
      - lighthouse
      - beacon_node
      - --testnet-dir=/testnet
      - --execution-endpoint=http://127.0.0.1:18661
      - --jwt-secrets=/jwt/jwt.hex
      - --checkpoint-sync-url=${L1_BEACON_URL}
      - --libp2p-addresses=${CL_MULTIADDR}
      - --trusted-peers=${CL_PEERID}
      - --disable-packet-filter
      - --enable-private-discovery
      - --disable-enr-auto-update
      - --http
      - --http-address=127.0.0.1
      - --http-port=5252
      - --listen-address=0.0.0.0
      - --port=9909
      - --datadir=/data
    logging:
      driver: "local"
