# COMPOSER side of a remote-prover split with an OUTBOUND-ONLY composer:
# driven dispatch ON, control transport REVERSED (the composer DIALS the
# prover machine; nothing listens here beyond loopback), and NO local
# eez-proverd (it runs remotely via docker-compose.proverd.remote.yml, in
# listen mode). See docs/reverse-control-transport-design.md.
#
# Use INSTEAD of docker-compose.driven.override.yml:
#
#   EEZ_CONTROL_DIAL_ADDR=<prover-ip:50051> \
#   docker compose --env-file .env.chiado \
#     -f docker-compose.chiado-node.yml \
#     -f docker-compose.remote-prover.override.yml up -d
#
# SIGNER — pair this with the ADDRESS-ONLY composer: .env.chiado sets
# EEZ_PROOF_SIGNER_ADDRESS (the registered authorizedSigner address) and
# does NOT set EEZ_PROOF_SIGNER_KEY; the key lives only on the prover
# machine. Requires deferred-post (EEZ_PROOF_SYSTEM_KIND=real) — the node
# refuses address-only mode otherwise.
#
# TRANSPORT — EEZ_CONTROL_DIAL_ADDR inverts only who opens the TCP socket
# (control_transport.rs): the composer redials with capped backoff forever,
# and the wire protocol is unchanged. This composer host needs NO inbound
# ports for the rollup. The prover machine must be reachable (e.g. DMZ) and
# MUST allowlist this host's public IP (EEZ_ALLOWED_COMPOSER_IPS) — its
# listener is otherwise an attestation oracle. IP literal only (no DNS).
services:
  eez-node:
    environment:
      # Composer-driven dispatch (stream verify ranges to the prover);
      # deferred-post itself comes from EEZ_PROOF_SYSTEM_KIND=real in
      # deployments.env, exactly as in docker-compose.driven.override.yml.
      EEZ_COMPOSER_DRIVEN: "1"
      # The remote prover's listener (ip:port, or bare ip → default port).
      # The composer dials OUT to it — mutually exclusive with
      # EEZ_CONTROL_RPC_ADDR (listen mode); startup bails if both are set.
      EEZ_CONTROL_DIAL_ADDR: "${EEZ_CONTROL_DIAL_ADDR:?set EEZ_CONTROL_DIAL_ADDR to the remote prover's ip:port, e.g. 203.0.113.9:50051}"
