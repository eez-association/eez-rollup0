[workspace]
resolver = "2"
members = [
    "crates/eez-driver",
    "crates/eez-node",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
# async + tracing + errors
tokio              = { version = "1", features = ["full"] }
futures-util       = "0.3"
tracing            = "0.1"
tracing-subscriber = "0.3"
thiserror          = "2"
eyre               = "0.6"

# allocator for the binary
mimalloc           = "0.1"

# CLI
clap               = { version = "4", features = ["derive"] }

# reth — pinned to upstream tag v2.2.0.
reth-chainspec                  = { git = "https://github.com/paradigmxyz/reth", tag = "v2.2.0" }
reth-cli-runner                 = { git = "https://github.com/paradigmxyz/reth", tag = "v2.2.0" }
reth-engine-primitives          = { git = "https://github.com/paradigmxyz/reth", tag = "v2.2.0" }
reth-ethereum-cli               = { git = "https://github.com/paradigmxyz/reth", tag = "v2.2.0" }
reth-ethereum-engine-primitives = { git = "https://github.com/paradigmxyz/reth", tag = "v2.2.0" }
reth-node-builder               = { git = "https://github.com/paradigmxyz/reth", tag = "v2.2.0" }
reth-node-ethereum              = { git = "https://github.com/paradigmxyz/reth", tag = "v2.2.0" }
reth-payload-builder            = { git = "https://github.com/paradigmxyz/reth", tag = "v2.2.0" }
reth-payload-primitives         = { git = "https://github.com/paradigmxyz/reth", tag = "v2.2.0" }
reth-primitives-traits          = { version = "0.3.1", default-features = false }
reth-storage-api                = { git = "https://github.com/paradigmxyz/reth", tag = "v2.2.0" }
reth-tasks                      = { git = "https://github.com/paradigmxyz/reth", tag = "v2.2.0" }

# alloy — must align with reth v2.2.0's transitive picks
# (alloy-primitives 1.x is unchanged; rpc-types-engine and consensus moved to 2.x).
alloy-consensus        = { version = "1", default-features = false }
alloy-primitives       = { version = "1", default-features = false }
alloy-rpc-types-engine = { version = "2", default-features = false }

# internal crates
eez-driver = { path = "crates/eez-driver" }

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1

[profile.dev]
opt-level = 1

[workspace.lints.rust]
ambiguous_negative_literals  = "warn"
missing_debug_implementations = "warn"
redundant_imports             = "warn"
redundant_lifetimes           = "warn"
trivial_numeric_casts         = "warn"
unsafe_op_in_unsafe_fn        = "warn"
unused_lifetimes              = "warn"

[workspace.lints.clippy]
correctness = { level = "warn", priority = -1 }
suspicious  = { level = "warn", priority = -1 }
perf        = { level = "warn", priority = -1 }
style       = { level = "warn", priority = -1 }
complexity  = { level = "warn", priority = -1 }
pedantic    = { level = "warn", priority = -1 }

# Permit the structured-logging macro format used by tracing::event! per M-LOG-STRUCTURED.
literal_string_with_formatting_args = "allow"
