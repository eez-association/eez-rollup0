[workspace]
resolver = "2"
members = [
    "crates/eez-deriver",
    "crates/eez-driver",
    "crates/eez-follower",
    "crates/eez-l1",
    "crates/eez-node",
    "crates/eez-payload-codec",
    "crates/eez-prover",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"

[workspace.dependencies]
# async + tracing + errors
tokio              = { version = "1", features = ["full"] }
async-trait        = "0.1"
dotenvy            = "0.15"
futures-util       = "0.3"
tracing            = "0.1"
tracing-subscriber = "0.3"
thiserror          = "2"
eyre               = "0.6"

# allocator for the binary
mimalloc           = "0.1"

# CLI
clap               = { version = "4", features = ["derive"] }

# reth — pinned to mediocregopher/partial-persistence-clean tip (contains the receipts-reorg truncation fix).
reth-chain-state                = { git = "https://github.com/paradigmxyz/reth", rev = "fd59fd2222b51239abebd9aa234f28b0b5f336eb" }
reth-chainspec                  = { git = "https://github.com/paradigmxyz/reth", rev = "fd59fd2222b51239abebd9aa234f28b0b5f336eb" }
reth-cli-runner                 = { git = "https://github.com/paradigmxyz/reth", rev = "fd59fd2222b51239abebd9aa234f28b0b5f336eb" }
reth-engine-primitives          = { git = "https://github.com/paradigmxyz/reth", rev = "fd59fd2222b51239abebd9aa234f28b0b5f336eb" }
reth-ethereum-cli               = { git = "https://github.com/paradigmxyz/reth", rev = "fd59fd2222b51239abebd9aa234f28b0b5f336eb" }
reth-ethereum-engine-primitives = { git = "https://github.com/paradigmxyz/reth", rev = "fd59fd2222b51239abebd9aa234f28b0b5f336eb" }
reth-ethereum-primitives        = { git = "https://github.com/paradigmxyz/reth", rev = "fd59fd2222b51239abebd9aa234f28b0b5f336eb" }
reth-evm                        = { git = "https://github.com/paradigmxyz/reth", rev = "fd59fd2222b51239abebd9aa234f28b0b5f336eb" }
reth-evm-ethereum               = { git = "https://github.com/paradigmxyz/reth", rev = "fd59fd2222b51239abebd9aa234f28b0b5f336eb" }
reth-node-builder               = { git = "https://github.com/paradigmxyz/reth", rev = "fd59fd2222b51239abebd9aa234f28b0b5f336eb" }
reth-node-ethereum              = { git = "https://github.com/paradigmxyz/reth", rev = "fd59fd2222b51239abebd9aa234f28b0b5f336eb" }
reth-payload-builder            = { git = "https://github.com/paradigmxyz/reth", rev = "fd59fd2222b51239abebd9aa234f28b0b5f336eb" }
reth-payload-primitives         = { git = "https://github.com/paradigmxyz/reth", rev = "fd59fd2222b51239abebd9aa234f28b0b5f336eb" }
reth-primitives-traits          = { version = "0.3.1", default-features = false }
reth-provider                   = { git = "https://github.com/paradigmxyz/reth", rev = "fd59fd2222b51239abebd9aa234f28b0b5f336eb" }
reth-revm                       = { git = "https://github.com/paradigmxyz/reth", rev = "fd59fd2222b51239abebd9aa234f28b0b5f336eb" }
reth-storage-api                = { git = "https://github.com/paradigmxyz/reth", rev = "fd59fd2222b51239abebd9aa234f28b0b5f336eb" }
reth-tasks                      = { git = "https://github.com/paradigmxyz/reth", rev = "fd59fd2222b51239abebd9aa234f28b0b5f336eb" }
revm                            = { version = "38", default-features = false }

# alloy — aligned with reth v2.2.0's transitive picks:
#   consensus / eips / network / rpc-types-engine / provider / contract → 2.x
#   primitives / sol-types / signer-local                                → 1.x
# Mismatched majors here will cause duplicate alloy types in the dep graph
# (manifesting as "trait bound not satisfied" errors at integration sites).
alloy-consensus        = { version = "2", default-features = false }
alloy-contract         = { version = "2", default-features = false }
alloy-eips             = { version = "2", default-features = false }
alloy-network          = { version = "2", default-features = false }
alloy-primitives       = { version = "1", default-features = false }
alloy-provider         = { version = "2", default-features = false, features = ["reqwest"] }
alloy-rlp              = { version = "0.3", features = ["derive"] }
alloy-rpc-types-engine = { version = "2", default-features = false }
alloy-rpc-types-eth    = { version = "2", default-features = false }
alloy-signer           = { version = "2", default-features = false }
alloy-signer-local     = { version = "2", default-features = false }
alloy-sol-types        = { version = "1", default-features = false }
url                    = "2"

# internal crates
eez-deriver        = { path = "crates/eez-deriver" }
eez-driver         = { path = "crates/eez-driver" }
eez-l1             = { path = "crates/eez-l1" }
eez-payload-codec  = { path = "crates/eez-payload-codec" }
eez-prover         = { path = "crates/eez-prover" }

[profile.release]
lto = "thin"
codegen-units = 1
debug = 1

[profile.dev]
opt-level = 1

[workspace.lints.rust]
ambiguous_negative_literals  = "warn"
missing_debug_implementations = "warn"
redundant_imports             = "warn"
redundant_lifetimes           = "warn"
trivial_numeric_casts         = "warn"
unsafe_op_in_unsafe_fn        = "warn"
unused_lifetimes              = "warn"

[workspace.lints.clippy]
correctness = { level = "warn", priority = -1 }
suspicious  = { level = "warn", priority = -1 }
perf        = { level = "warn", priority = -1 }
style       = { level = "warn", priority = -1 }
complexity  = { level = "warn", priority = -1 }
pedantic    = { level = "warn", priority = -1 }

# Permit the structured-logging macro format used by tracing::event! per M-LOG-STRUCTURED.
literal_string_with_formatting_args = "allow"
