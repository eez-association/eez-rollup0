# Profiles copied from reth (paradigmxyz/reth Cargo.toml), minus its
# hivetests/reproducible CI profiles. `release` is the fast-to-build
# default (the Docker images use it); `maxperf` is reth's
# production-release profile when top runtime speed is worth the
# build time; `profiling` keeps symbols for perf tooling.
[profile.dev]
# https://davidlattimore.github.io/posts/2024/02/04/speeding-up-the-rust-edit-build-run-cycle.html
debug = "line-tables-only"
split-debuginfo = "unpacked"
# Not in reth: this workspace predates the copy and keeps opt-level 1
# so a dev-built node stays usable for local runs.
opt-level = 1

# Speed up tests.
[profile.dev.package]
proptest.opt-level = 3
rand_chacha.opt-level = 3
rand_xorshift.opt-level = 3
unarray.opt-level = 3

[profile.ci-e2e]
inherits = "dev"
debug = "none"
split-debuginfo = "off"
incremental = false

[profile.release]
opt-level = 3
lto = "thin"
debug = "none"
strip = "symbols"
panic = "unwind"
codegen-units = 16

# Use the `--profile profiling` flag to show symbols in release mode.
# e.g. `cargo build --profile profiling`
[profile.profiling]
inherits = "release"
debug = "full"
strip = "none"

# Include debug info in benchmarks too.
[profile.bench]
inherits = "profiling"

[profile.maxperf]
inherits = "release"
lto = "fat"
codegen-units = 1

[profile.maxperf-symbols]
inherits = "maxperf"
debug = "full"
strip = "none"

[workspace.lints.rust]
ambiguous_negative_literals  = "warn"
missing_debug_implementations = "warn"
redundant_imports             = "warn"
redundant_lifetimes           = "warn"
trivial_numeric_casts         = "warn"
unsafe_op_in_unsafe_fn        = "warn"
unused_lifetimes              = "warn"

[workspace.lints.clippy]
correctness = { level = "warn", priority = -1 }
suspicious  = { level = "warn", priority = -1 }
perf        = { level = "warn", priority = -1 }
style       = { level = "warn", priority = -1 }
complexity  = { level = "warn", priority = -1 }
pedantic    = { level = "warn", priority = -1 }

# Permit the structured-logging macro format used by tracing::event! per M-LOG-STRUCTURED.
literal_string_with_formatting_args = "allow"

# Pragmatic opt-outs for pedantic rules that don't fit the reth-integration / protocol-port style.
# Mirrors the source workspace (rollup-node) so ported crates compile under the same posture they
# were written for — adding these later, per-file, would be noise.
module_name_repetitions          = "allow"
must_use_candidate               = "allow"
missing_panics_doc               = "allow"
missing_errors_doc               = "allow"
similar_names                    = "allow"
cast_possible_truncation         = "allow"
too_many_lines                   = "allow"
default_trait_access             = "allow"
missing_fields_in_debug          = "allow"
renamed_function_params          = "allow"
doc_markdown                     = "allow"
doc_lazy_continuation            = "allow"
ignored_unit_patterns            = "allow"
implicit_hasher                  = "allow"
items_after_statements           = "allow"
unreadable_literal               = "allow"
semicolon_if_nothing_returned    = "allow"
many_single_char_names           = "allow"
assigning_clones                 = "allow"
match_wildcard_for_single_variants = "allow"
used_underscore_items            = "allow"
unused_self                      = "allow"
needless_pass_by_value           = "allow"
if_then_some_else_none           = "allow"
type_complexity                  = "allow"
match_single_binding             = "allow"
single_match_else                = "allow"
map_unwrap_or                    = "allow"
clone_on_ref_ptr                 = "allow"
# New in clippy 1.99; `assert!(v.is_empty())` reads better in tests than `[] as [T; 0]`.
assert_is_empty                  = "allow"
# constructors / handlers (Deriver::new wires 9 deps,
# on_batch_posted 10, compose_via_evm_composer 8) need these params;
# a refactor or dediacted crates would reduce some of this
too_many_arguments               = "allow"
