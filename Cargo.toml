[workspace]
resolver = "2"
members = [
    "crates/eez-composer",
    "crates/eez-control-rpc",
    "crates/eez-deriver",
    "crates/eez-driver",
    "crates/eez-follower",
    "crates/eez-l1",
    "crates/eez-node",
    "crates/eez-node-common",
    "crates/eez-node-e2e",
    "crates/eez-payload-codec",
    "crates/eez-proof-signer",
    "crates/eez-prover-stateful",
    "crates/eez-prover-stateless",
    "crates/eez-protocol",
    "crates/eez-primitives",
    "crates/eez-evm",
    "crates/eez-prover",
    "crates/eez-prover-client",
    "crates/eez-testkit",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.95"

[workspace.dependencies]
# async + tracing + errors
tokio              = { version = "1", features = ["full"] }
async-trait        = "0.1"
dotenvy            = "0.15"
futures-util       = "0.3"
tracing            = "0.1"
tracing-subscriber = "0.3"
thiserror          = "2"
eyre               = "0.6"
serde              = { version = "1", features = ["derive"] }
sha3               = "0.10"
hex                = "0.4"
lru                = "0.16.4"

# grpc — eez-control-rpc `Prove` wire (composer client ↔ proof-signer server).
# tonic 0.14 splits codegen out: tonic runtime, tonic-prost glue, tonic-prost-build (build-dep).
tonic                 = "0.14"
tonic-prost           = "0.14"
tonic-prost-build     = "0.14"
protoc-bin-vendored   = "3"
prost                 = "0.14"
tokio-stream          = "0.1"
getrandom             = "0.3"
# compact binary serialization for the persistent witness store's values
postcard              = { version = "1", features = ["use-std"] }
# reth `debug_executionWitness` result shape — mirrors the proto ExecutionWitness.
alloy-rpc-types-debug = { version = "=2.5.0", default-features = false }

# prover-port crates (composer-controlled prover, Model B)
eez-control-rpc    = { path = "crates/eez-control-rpc" }
eez-prover-client  = { path = "crates/eez-prover-client" }

# allocator for the binary
mimalloc           = "0.1"

# CLI
clap               = { version = "4", features = ["derive"] }

reth-codecs = { version = "0.8.1" }
reth-rpc-traits = "0.8.1"
alloy-consensus-any = { version = "=2.5.0", features = ["serde"] }
alloy-serde = "=2.5.0"

# reth — official v2.7.0 release. Pinned by `tag`, never `rev`: reth_gnosis,
# gnosis-primitives and stateless use the tag too, and Cargo treats a tag and a
# rev of the same commit as distinct sources (duplicate reth types).
reth-chain-state                = { git = "https://github.com/paradigmxyz/reth", tag = "v2.7.0" }
reth-chainspec                  = { git = "https://github.com/paradigmxyz/reth", tag = "v2.7.0" }
reth-cli                        = { git = "https://github.com/paradigmxyz/reth", tag = "v2.7.0" }
reth-db                         = { git = "https://github.com/paradigmxyz/reth", tag = "v2.7.0" }
reth-engine-primitives          = { git = "https://github.com/paradigmxyz/reth", tag = "v2.7.0" }
reth-ethereum-cli               = { git = "https://github.com/paradigmxyz/reth", tag = "v2.7.0" }
reth-ethereum-engine-primitives = { git = "https://github.com/paradigmxyz/reth", tag = "v2.7.0" }
reth-ethereum-consensus         = { git = "https://github.com/paradigmxyz/reth", tag = "v2.7.0" }
reth-ethereum-payload-builder   = { git = "https://github.com/paradigmxyz/reth", tag = "v2.7.0" }
reth-ethereum-primitives        = { git = "https://github.com/paradigmxyz/reth", tag = "v2.7.0" }
reth-evm                        = { git = "https://github.com/paradigmxyz/reth", tag = "v2.7.0" }
reth-evm-ethereum               = { git = "https://github.com/paradigmxyz/reth", tag = "v2.7.0" }
reth-execution-types            = { git = "https://github.com/paradigmxyz/reth", tag = "v2.7.0" }
reth-network-peers              = { git = "https://github.com/paradigmxyz/reth", tag = "v2.7.0" }
reth-node-api                   = { git = "https://github.com/paradigmxyz/reth", tag = "v2.7.0" }
reth-node-builder               = { git = "https://github.com/paradigmxyz/reth", tag = "v2.7.0" }
reth-node-core                  = { git = "https://github.com/paradigmxyz/reth", tag = "v2.7.0" }
reth-node-ethereum              = { git = "https://github.com/paradigmxyz/reth", tag = "v2.7.0" }
reth-payload-builder            = { git = "https://github.com/paradigmxyz/reth", tag = "v2.7.0" }
reth-payload-primitives         = { git = "https://github.com/paradigmxyz/reth", tag = "v2.7.0" }
reth-transaction-pool           = { git = "https://github.com/paradigmxyz/reth", tag = "v2.7.0" }
reth-primitives-traits          = { version = "0.8.1", default-features = false }
reth-provider                   = { git = "https://github.com/paradigmxyz/reth", tag = "v2.7.0" }
reth-revm                       = { git = "https://github.com/paradigmxyz/reth", tag = "v2.7.0" }
reth-rpc-eth-api                = { git = "https://github.com/paradigmxyz/reth", tag = "v2.7.0" }
reth-storage-errors = { git = "https://github.com/paradigmxyz/reth", tag = "v2.7.0" }
reth-storage-api                = { git = "https://github.com/paradigmxyz/reth", tag = "v2.7.0" }
reth-tasks                      = { git = "https://github.com/paradigmxyz/reth", tag = "v2.7.0" }
reth-trie                       = { git = "https://github.com/paradigmxyz/reth", tag = "v2.7.0" }
reth-trie-common                = { git = "https://github.com/paradigmxyz/reth", tag = "v2.7.0" }
# libmdbx (reth's own mdbx binding) — backs the persistent witness store in a
# DEDICATED env (never reth's node DB). Same tag so we don't link a 2nd mdbx build.
reth-libmdbx                    = { git = "https://github.com/paradigmxyz/reth", tag = "v2.7.0" }
reth-basic-payload-builder = { git = "https://github.com/paradigmxyz/reth", tag = "v2.7.0" }
reth-consensus = { git = "https://github.com/paradigmxyz/reth", tag = "v2.7.0" }
reth-consensus-common = { git = "https://github.com/paradigmxyz/reth", tag = "v2.7.0" }
reth-errors = { git = "https://github.com/paradigmxyz/reth", tag = "v2.7.0" }
reth-execution-cache = { git = "https://github.com/paradigmxyz/reth", tag = "v2.7.0" }
reth-payload-builder-primitives = { git = "https://github.com/paradigmxyz/reth", tag = "v2.7.0" }
reth-engine-local = { git = "https://github.com/paradigmxyz/reth", tag = "v2.7.0" }
reth-rpc = { git = "https://github.com/paradigmxyz/reth", tag = "v2.7.0" }
reth-rpc-convert = { git = "https://github.com/paradigmxyz/reth", tag = "v2.7.0" }
reth-rpc-eth-types = { git = "https://github.com/paradigmxyz/reth", tag = "v2.7.0" }

# Stateless execution on the same reth v2.7.0 as the node. Branch
# feat/reth-v2.7-candidate-block-hashes: the reth-v2.7 trie port plus our
# candidate block hashes and empty-prefix checkpoint, pending upstream merge.
stateless-reth = { package = "stateless", git = "https://github.com/eez-association/stateless", rev = "935f25aa0c28c36c3c169e36e36b823206c5a856" }

# reth_gnosis — Gnosis chain (chiado / gnosis mainnet) NodeBuilder.
# Both pin reth `tag = "v2.7.0"` like our reth-* deps, so the inner types are
# wire-compatible. Provides `GnosisNode`, `GnosisChainSpec`, chiado genesis preset.
# reth_gnosis depends on `reth` with default features, which turns on `jit`
# (revmc → LLVM 22) and `gmp` (m4) for the whole graph; see scripts/ci/install-llvm.sh.
reth_gnosis                     = { git = "https://github.com/gnosischain/reth_gnosis", tag = "v2.2.0" }
gnosis-primitives               = { git = "https://github.com/gnosischain/rust-primitives.git", tag = "v0.2.9" }
revm                            = { version = "43", default-features = false, features = [
    "optional_balance_check",
    "optional_block_gas_limit",
    "optional_eip3607",
    "optional_no_base_fee",
] }

# alloy — aligned with reth v2.7.0's transitive picks:
#   consensus / eips / network / rpc-types-engine / provider / contract → 2.x
#   primitives / sol-types / signer-local                                → 1.x
# Mismatched majors here will cause duplicate alloy types in the dep graph
# (manifesting as "trait bound not satisfied" errors at integration sites).
alloy-evm              = { version = "=0.39.0" }
alloy-consensus        = { version = "=2.5.0", default-features = false }
alloy-contract         = { version = "2", default-features = false }
alloy-eips             = { version = "=2.5.0", default-features = false }
alloy-genesis          = { version = "=2.5.0", default-features = false }
alloy-network          = { version = "2", default-features = false }
alloy-primitives       = { version = "1", default-features = false }
alloy-provider         = { version = "2", default-features = false, features = ["reqwest"] }
alloy-rlp              = { version = "0.3", features = ["derive"] }
alloy-rpc-types-engine = { version = "2", default-features = false }
alloy-rpc-types-eth    = { version = "2", default-features = false }
alloy-signer           = { version = "2", default-features = false }
alloy-signer-local     = { version = "2", default-features = false }
alloy-sol-types        = { version = "1", default-features = false }
fail                   = "0.5"
k256                   = { version = "0.13", features = ["ecdsa", "arithmetic"] }
url                    = "2"

# bundler (eth_sendBundle) submission path
reqwest                = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde_json             = "1"

# jsonrpsee — used by eez-node's TxIngress middleware (eth_sendRawTransaction override).
# Pinned to whatever reth's pinned rev uses; cargo resolves the right minor.
jsonrpsee              = { version = "0.26", features = ["server", "macros"] }

# internal crates
eez-evm = { path = "crates/eez-evm" }
eez-primitives = { path = "crates/eez-primitives" }
eez-composer       = { path = "crates/eez-composer" }
eez-deriver        = { path = "crates/eez-deriver" }
eez-driver         = { path = "crates/eez-driver" }
eez-follower       = { path = "crates/eez-follower" }
eez-l1             = { path = "crates/eez-l1" }
eez-node           = { path = "crates/eez-node" }
eez-node-common    = { path = "crates/eez-node-common" }
eez-payload-codec  = { path = "crates/eez-payload-codec" }
eez-proof-signer   = { path = "crates/eez-proof-signer" }
eez-protocol       = { path = "crates/eez-protocol" }
eez-prover         = { path = "crates/eez-prover" }
eez-prover-stateful  = { path = "crates/eez-prover-stateful" }
eez-prover-stateless = { path = "crates/eez-prover-stateless" }
eez-testkit        = { path = "crates/eez-testkit" }

# Interim: reth main at the merge of paradigmxyz/reth#27622 (fa9e76a), via the
# debjit-bw/reth fork because a patch cannot point back at its own source. Every
# reth crate is redirected, including those reth_gnosis and stateless pull by
# tag, so the graph keeps one reth source. Remove once a reth release carries
# #27622; see docs/RETH-V2.7-MIGRATION.md.
